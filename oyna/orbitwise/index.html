<!DOCTYPE html>
<!--
=====================================================================
  Orbitwise (çalışma adı Birim Top) — Little Lemma. Uzay teması.

  OYUN
  - Roket (taş) her hamlede o anki normun birim topu içindeki bir kayaya zıplar.
  - Boş uzay (#): üstünden uçulur, içine inilmez.
  - Gezegenler (a/b/c): inince norm ℓ¹ / ℓ² / ℓ∞ olur ("çekim alanı").
  - Top modu = "alan", küre modu = "yörünge" (yalnızca sınıra inilir).
  - Üs (G): bölüm biter. Hamle ≤ par → 3★, ≤ par+2 → 2★, diğeri → 1★.

  KAYNAK: bu dosya src/template.html. www/index.html'i ELLE DÜZENLEME;
  `npm run build` üretir (LOGIC yer tutucusu ← tools/logic.js, LEVELS yer tutucusu ← levels/levels.json).

  BÖLÜMLER
  - ===== DATA =====   WORLDS + logic (build sırasında gömülür)
  - ===== CORE =====   kayıt, tema, dil, ses
  - ===== BOARD =====  SVG uzay tahtası, roket, gezegenler
  - ===== UI =====     ekranlar, düğmeler, akış
=====================================================================
-->

<style>
  /* ---------- tema değişkenleri (stüdyo pastel ailesi) ---------- */
  :root {
    --bg: #eef1f5;
    --ink: #1f2a44;
    --muted: #7a8599;
    --panel: #ffffff;
    --soft: #e0e5ec;
    --accent: #1f2a44;
    --accent-ink: #ffffff;
    --accent-sh: #0e1527;
    --sh: 31,42,68;
    --link: #3878da;
    --danger: #d32f2a;
    --overlay: rgba(238,241,245,.84);
    --sel-bg: #eaf2ff;
    --star: #ffb020;
    --star-off: rgba(31,42,68,.14);

    /* uzay tahtası (iki temada da gece; açık temada daha pastel) */
    --space-1: #46508a;
    --space-2: #2c335e;
    --pad: rgba(255,255,255,.13);
    --pad-edge: rgba(255,255,255,.07);
    --crater: rgba(20,24,50,.18);

    /* normlar: pastel ton + açık zeminde okunacak mürekkep tonu */
    --l1: #ffb98a;   --l1-ink: #b8582a;
    --l2: #8cc4f7;   --l2-ink: #1f4f8f;
    --linf: #8fdcae; --linf-ink: #2a7a4f;
    --ell: #cdb4f6;  --ell-ink: #6a45b8;    /* Kepler */
    --lp: #ffb3cf;   --lp-ink: #b03a6a;     /* squircle */
    --bh: #b3b9e0;   --bh-ink: #3d4670;     /* kara delik */
    --mirror: #e3e8f2;
    --goal: #ffd97a;
    --flag: #ff9e8f;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #14171f;
    --ink: #eef1f5;
    --muted: #8e97a8;
    --panel: #232836;
    --soft: #2d3444;
    --accent: #eef1f5;
    --accent-ink: #1f2a44;
    --accent-sh: #8e97a8;
    --sh: 0,0,0;
    --link: #6aa6f5;
    --danger: #ff6b61;
    --overlay: rgba(20,23,31,.82);
    --sel-bg: #1e2c47;
    --star-off: rgba(255,255,255,.16);
    --space-1: #262d4a;
    --space-2: #171c31;
    --pad: rgba(255,255,255,.10);
    --l1-ink: #ffb98a; --l2-ink: #8cc4f7; --linf-ink: #8fdcae;
    --ell-ink: #cdb4f6; --lp-ink: #ffb3cf; --bh-ink: #c3cae8;
    color-scheme: dark;
  }
  .n-l1   { --nc: var(--l1);   --nc-ink: var(--l1-ink); }
  .n-l2   { --nc: var(--l2);   --nc-ink: var(--l2-ink); }
  .n-linf { --nc: var(--linf); --nc-ink: var(--linf-ink); }
  .n-ell  { --nc: var(--ell);  --nc-ink: var(--ell-ink); }
  .n-lp   { --nc: var(--lp);   --nc-ink: var(--lp-ink); }
  .n-bh   { --nc: var(--bh);   --nc-ink: var(--bh-ink); }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; }
  #app {
    height: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: max(14px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .lane { width: min(100%, 520px); }
  /* iPad dikey, açık iPhone Duo: daha geniş sütun (tahta büyüsün) */
  @media (min-width: 700px) and (min-height: 900px) { .lane { width: min(100%, 720px); } .lvname { font-size: 28px; } }

  /* ---------- üst çubuk ---------- */
  .top { display: flex; align-items: center; gap: 10px; }
  .titles { flex: 1; min-width: 0; text-align: center; }
  .kicker { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lvname { font-size: 24px; font-weight: 900; letter-spacing: -.5px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn {
    width: 44px; height: 44px; flex: none; border: 0; border-radius: 12px; background: var(--panel); color: var(--ink);
    display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 1px 0 rgba(var(--sh),.08);
    touch-action: manipulation;
  }
  .iconbtn svg { width: 22px; height: 22px; }
  .iconbtn:active { transform: scale(.95); }
  /* bugünün bulmacası çözülmediyse galaksi düğmesinde altın nokta (görünürlük, sahip 2026-11-20) */
  .iconbtn { position: relative; }
  .iconbtn.has-daily::after { content: ''; position: absolute; top: 7px; right: 7px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--goal); box-shadow: 0 0 0 2px var(--panel); }

  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .chip {
    background: var(--panel); border-radius: 999px; padding: 6px 13px; font-size: 14px; font-weight: 800;
    display: inline-flex; align-items: center; gap: 7px; box-shadow: 0 1px 0 rgba(var(--sh),.06); white-space: nowrap;
  }
  .chip small { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; }
  .chip b { font-variant-numeric: tabular-nums; font-size: 16px; }
  .chip .goal3 { color: var(--star); font-size: 11px; letter-spacing: -1px; }
  .chip .sep { width: 1px; height: 14px; background: var(--soft); margin: 0 3px; }
  .chip.field { color: var(--nc-ink); transition: color .25s; }
  .chip.field svg { width: 18px; height: 18px; }
  .chip.field.pop { animation: chipPop .4s cubic-bezier(.2,1.6,.4,1); }
  @keyframes chipPop { 40% { transform: scale(1.12); } }
  /* alan çipi: dokununca bölümün kartları ("?") */
  button.chip { border: 0; cursor: pointer; touch-action: manipulation; font-family: inherit; }
  .chip .q { width: 18px; height: 18px; border-radius: 50%; background: var(--soft); color: var(--muted); font-size: 12px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; margin-right: -5px; }
  /* çıkmaz: Geri al düğmesi dikkat çeker */
  .btn.nudge { animation: nudge .9s ease-in-out 3; box-shadow: 0 0 0 3px var(--goal); }
  @keyframes nudge { 50% { transform: scale(1.07); } }
  .tutline { stroke: var(--goal); stroke-width: .06; stroke-dasharray: .12 .1; stroke-linecap: round; opacity: .85; }
  .help { min-height: 38px; text-align: center; font-size: 13.5px; line-height: 1.45; color: var(--muted); font-weight: 650; }
  .help b { color: var(--ink); }

  /* ---------- sahne (SVG uzay) ---------- */
  #stage { flex: 1 1 auto; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
  #sky { width: 100%; height: 100%; display: block; overflow: visible; }
  #sky.noanim * { transition: none !important; }
  .space-bg { fill: url(#gSpace); }
  .space-rim { fill: none; stroke: rgba(255,255,255,.08); stroke-width: .03; }
  .star { fill: #fff; }
  .tw { animation: tw 4s ease-in-out infinite alternate; }
  @keyframes tw { from { opacity: .25; } to { opacity: .75; } }
  .pad { fill: var(--pad); stroke: var(--pad-edge); stroke-width: .03; }
  .crater { fill: var(--crater); }
  .launch { fill: none; stroke: rgba(255,255,255,.35); stroke-width: .035; stroke-dasharray: .06 .07; }

  .field-g { transition: transform .38s cubic-bezier(.34,.12,.25,1), opacity .3s; }
  .field-shape { fill: var(--nc); fill-opacity: .10; stroke: var(--nc); stroke-width: .035; stroke-linejoin: round; stroke-opacity: .7; transition: fill .25s, stroke .25s; }
  .sphere .field-shape { fill-opacity: .03; stroke-width: .04; stroke-dasharray: .09 .09; animation: orbit 6s linear infinite; }
  @keyframes orbit { to { stroke-dashoffset: -1.08; } }
  .field-g.hidden { opacity: 0; }
  .field-g.reshape .field-shape { animation: reshape .45s cubic-bezier(.2,1.6,.4,1); transform-box: fill-box; transform-origin: center; }
  .sphere .field-g.reshape .field-shape { animation: reshape .45s cubic-bezier(.2,1.6,.4,1), orbit 6s linear infinite; }
  @keyframes reshape { from { transform: scale(.4); opacity: 0; } }

  /* Çekim halesi: ASLA döndürme — dönen kare elmasa, elmas kareye benzer (şekil = norm). */
  .halo { fill: currentColor; fill-opacity: .09; stroke: currentColor; stroke-width: .025; stroke-opacity: .35; }
  .spin { animation: spin 24s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Gidilebilir kareler: boş kayada küçük nokta, gezegen/üste zemin tonu (iç içe halka yok) */
  .dot { fill: var(--nc); animation: dot 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes dot { 50% { transform: scale(1.12); opacity: .8; } }
  .tint { fill: var(--nc); fill-opacity: .26; animation: tint 2.2s ease-in-out infinite; }
  @keyframes tint { 50% { fill-opacity: .16; } }
  .hintmark { fill: none; stroke: #fff; stroke-width: .07; animation: hintp 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes hintp { 50% { transform: scale(1.15); opacity: .35; } }
  .hit { fill: transparent; cursor: pointer; }
  .pad.ice { fill: rgba(214,240,255,.32); stroke: rgba(255,255,255,.35); }
  .pull { fill: none; stroke: #fff; stroke-opacity: .5; stroke-width: .035; stroke-linecap: round; stroke-linejoin: round; }
  /* Karanlık Bulutsu */
  .dark-level .space-bg { fill: #0b0d19; }
  .fogc { fill: #070912; fill-opacity: .96; transition: opacity .6s ease-out; }
  .fogc.gone { opacity: 0; }
  .sun-rays { stroke: #ffd97a; stroke-width: .04; stroke-linecap: round; animation: spin 18s linear infinite; transform-box: fill-box; transform-origin: center; }
  .dark-level #goalG { filter: drop-shadow(0 0 .12px #ffd97a); }
  .boosted .ship-base { stroke-width: .05; stroke-dasharray: .08 .06; }
  .chip .boost { background: var(--nc); color: #1f2a44; border-radius: 6px; padding: 0 5px; font-size: 12px; margin-left: 2px; }

  #ship { transition: transform .38s cubic-bezier(.34,.12,.25,1); }
  #shipRot { transition: transform .2s ease-out; }
  #shipHop.hop { animation: hop .38s cubic-bezier(.3,.2,.3,1); }
  @keyframes hop { 45% { transform: scale(1.32); } }
  .flame { opacity: 0; transform-box: fill-box; transform-origin: 50% 0; }
  #shipHop.hop .flame { animation: flame .38s ease-out; }
  @keyframes flame { 0% { opacity: 0; transform: scaleY(.3); } 30% { opacity: 1; transform: scaleY(1.35); } 100% { opacity: 0; transform: scaleY(.6); } }
  #shipBob { animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-.025px); } }
  .ship-base { fill: none; stroke: var(--nc); stroke-width: .028; stroke-opacity: .85; transition: stroke .25s; }
  .ship-glow-stop { stop-color: var(--nc); transition: stop-color .25s; }
  #shipHop.land .ship-base { animation: land .4s ease-out; transform-box: fill-box; transform-origin: center; }
  @keyframes land { from { transform: scale(1.6); opacity: .2; } }
  .trail { stroke: #fff; stroke-width: .045; stroke-linecap: round; stroke-dasharray: .01 .13; fill: none; animation: trail 1.1s ease-out forwards; }
  @keyframes trail { from { opacity: .8; } to { opacity: 0; } }
  .spark { fill: var(--goal); animation: spark .9s ease-out forwards; transform-box: fill-box; transform-origin: center; }   /* yoksa tahtanın köşesine doğru küçülüp ortaya kayıyordu */
  @keyframes spark { from { opacity: 1; } to { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(.3); } }
  .goal-core.won { animation: goalwin .7s ease-out; transform-box: fill-box; transform-origin: center; }
  /* kazanma: o anki alan şekli üssten halka halka büyür (DÖNMEZ, yalnız büyür: şekil = norm) */
  .spark.alt { fill: var(--nc); }
  .burst { fill: none; stroke: var(--nc); stroke-width: 4px; vector-effect: non-scaling-stroke; opacity: 0;
    transform-box: fill-box; transform-origin: center; animation: burst 1.2s cubic-bezier(.2,.7,.3,1) forwards; }
  .burst.gold { stroke: var(--goal); }
  @keyframes burst { from { transform: scale(.25); opacity: 1; } to { transform: scale(4.2); opacity: 0; } }
  .spark.long { animation-duration: 1.3s; }
  #sky.perfect .space-rim { animation: rimglow 1.3s ease-out; }
  @keyframes rimglow { 25% { stroke: var(--goal); stroke-width: .09; } }
  @media (prefers-reduced-motion: reduce) { .burst { display: none; } #sky.perfect .space-rim { animation: none; } }
  @keyframes goalwin { 40% { transform: scale(1.5); } }

  /* ---------- geniş ve yatay ekran (iPad yatay, Mac, açık iPhone Duo yatay): yan panel ----------
     Stüdyo kuralı (2026-11-14): düzen sabit bir ekran oranı varsaymaz; genişlik yetince yan panel açılır.
     Tahta solda kalan bütün yüksekliği kullanır; başlık, bilgi ve düğmeler sağdaki panelde. */
  @media (min-width: 860px) and (min-aspect-ratio: 11/10) {
    #app {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); grid-template-rows: auto auto auto 1fr auto;
      column-gap: 32px; row-gap: 14px; align-items: start; width: min(100%, 1280px); margin: 0 auto;
      padding-left: max(24px, env(safe-area-inset-left)); padding-right: max(24px, env(safe-area-inset-right));
    }
    #app > .lane { width: 100%; }
    #stage { grid-column: 1; grid-row: 1 / -1; height: 100%; }
    .top, .chips, .help, .actions { grid-column: 2; }
    .top { grid-row: 1; } .chips { grid-row: 2; justify-content: flex-start; } .help { grid-row: 3; text-align: left; }
    .titles { text-align: left; }
    .actions { grid-row: 5; flex-wrap: wrap; }
    .actions .btn { flex: 1 1 calc(50% - 4px); height: 64px; font-size: 13px; }
  }

  /* ---------- alt düğmeler ---------- */
  .actions { display: flex; gap: 8px; }
  .btn {
    flex: 1; height: 54px; border: 0; border-radius: 16px; cursor: pointer; touch-action: manipulation;
    font-size: 16px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    background: var(--panel); color: var(--ink); box-shadow: 0 2px 0 rgba(var(--sh),.08);
    transition: transform .08s, opacity .15s, background .15s;
  }
  .btn:active { transform: translateY(1px) scale(.98); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 var(--accent-sh); }
  .btn.small { flex: 0 0 auto; height: 46px; padding: 0 18px; font-size: 15px; }
  .btn svg { width: 21px; height: 21px; flex: none; }
  .actions .btn { flex-direction: column; gap: 2px; height: 58px; font-size: 11.5px; font-weight: 800; color: var(--muted); }
  .actions .btn svg { color: var(--ink); }
  .actions .btn.off svg { opacity: .35; }
  .actions .btn { position: relative; }
  .badge { position: absolute; top: 5px; right: 7px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; font-size: 11px; font-weight: 900; line-height: 18px; text-align: center; background: var(--soft); color: var(--ink); }
  .badge:empty { display: none; }
  .badge.ad { background: var(--goal); color: #3b2200; }

  /* ---------- pencereler ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 30; background: var(--overlay);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal.show { display: flex; animation: fade .22s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    width: min(100%, 380px); max-height: 100%; overflow-y: auto; touch-action: pan-y;
    background: var(--panel); border-radius: 24px; padding: 22px;
    box-shadow: 0 12px 40px rgba(var(--sh),.18); display: flex; flex-direction: column; align-items: stretch; gap: 10px; text-align: center;
  }
  .modal.show .sheet { animation: rise .3s cubic-bezier(.2,1.3,.4,1); }
  @keyframes rise { from { transform: translateY(24px) scale(.97); } }
  .sheet h2 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -.5px; }
  .sheet p { margin: 0; color: var(--muted); font-weight: 650; line-height: 1.5; }
  .sheet .body { text-align: left; color: var(--ink); font-weight: 600; line-height: 1.5; display: flex; flex-direction: column; gap: 8px; }
  .sheet .btns { display: flex; gap: 8px; margin-top: 4px; flex: none; }
  .sheet > .btn { flex: none; }
  .sheet .btn:not(.primary) { background: var(--bg); box-shadow: none; }
  .bigstars { font-size: 46px; line-height: 1; color: var(--star); display: flex; gap: 6px; justify-content: center; margin: 4px 0; }
  .bigstars span { display: inline-block; animation: starIn .35s cubic-bezier(.2,1.6,.4,1) both; }
  .bigstars span.off { color: var(--star-off); }
  .bigstars span:nth-child(2) { animation-delay: .18s; font-size: 56px; margin-top: -8px; }
  .bigstars span:nth-child(3) { animation-delay: .36s; }
  @keyframes starIn { from { transform: scale(0) rotate(-40deg); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .shapes { display: flex; justify-content: space-around; padding: 12px 6px; background: var(--space-2); border-radius: 16px; }
  .shapes div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; color: rgba(255,255,255,.85); }
  .shapes svg { width: 52px; height: 52px; }
  .planet-hero { background: linear-gradient(160deg, var(--space-1), var(--space-2)); border-radius: 18px; padding: 14px; display: flex; justify-content: center; }
  .planet-hero svg { width: 120px; height: 120px; }
  .cardfound { font-size: 12px; font-weight: 900; letter-spacing: .6px; text-transform: uppercase; color: var(--link); margin-bottom: -4px; }
  .cardfound:empty { display: none; }

  /* ayarlar (−2048 ile aynı) */
  .setrow { display: flex; align-items: center; justify-content: space-between; padding: 12px 2px; border-bottom: 1px solid var(--soft); font-weight: 700; }
  .switch { width: 50px; height: 30px; border-radius: 999px; border: 0; background: var(--soft); position: relative; cursor: pointer; transition: background .15s; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch.on { background: #2fb36b; }
  .switch.on::after { transform: translateX(20px); }
  .setrow.setlink { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--soft); border-radius: 0; font-weight: 700; cursor: pointer; text-align: left; }
  .seg { display: flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 800; cursor: pointer; }
  .seg button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 0 rgba(var(--sh),.1); }
  .setlink .val { display: inline-flex; align-items: center; gap: 2px; color: var(--muted); }
  .setlink .val svg { width: 18px; height: 18px; }
  .linkbtn { background: none; border: 0; font-weight: 700; color: var(--link); cursor: pointer; padding: 10px 0; text-align: left; }
  .linkbtn.danger { color: var(--danger); }
  .langlist { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 6px; }
  .langopt {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px 10px 10px;
    border: 0; border-radius: 16px; background: var(--bg); text-align: left; cursor: pointer;
    box-shadow: inset 0 0 0 2px transparent; transition: background .15s, box-shadow .15s, transform .08s;
  }

<script>
// ===================== DATA =====================
// Oyun mantığı — TEK DOĞRULUK KAYNAĞI. Node araçlarında require edilir, build sırasında oyuna gömülür.
// Tanımlar ve kararlar: docs/TEMA_VE_MEKANIKLER.md

// ---------- normlar ----------
// Her norm: inBall(dx, dy, lv) ve bound(lv) (taranacak en büyük |dx|, |dy|).
// exactSphere varsa küre modu tam eşitliktir; yoksa "ayrık sınır" (topun içinde, 4 komşudan biri dışarıda).
const DEFAULT_PARAMS = {
  ell: { A: 1, B: 0, C: 4, D: 9 },   // dx² + 4dy² ≤ 9: yatay elips
  lp: { p: 4, T: 100 },              // |dx|⁴ + |dy|⁴ ≤ 100: yuvarlatılmış 7×7
  bh: { R: 4 },                      // √|dx| + √|dy| ≤ √4: dört kollu yıldız
};
const par = (lv, n) => ({ ...DEFAULT_PARAMS[n], ...(lv[n] || {}) });
const r2Of = lv => lv.r2 ?? lv.r * lv.r;

const NORM_DEFS = {
  l1: {
    inBall: (dx, dy, lv) => Math.abs(dx) + Math.abs(dy) <= lv.r,
    exactSphere: (dx, dy, lv) => Math.abs(dx) + Math.abs(dy) === lv.r,
    bound: lv => lv.r,
  },
  l2: {
    inBall: (dx, dy, lv) => dx * dx + dy * dy <= r2Of(lv),
    exactSphere: (dx, dy, lv) => dx * dx + dy * dy === r2Of(lv),
    bound: lv => Math.max(lv.r || 0, Math.ceil(Math.sqrt(r2Of(lv)))),
  },
  linf: {
    inBall: (dx, dy, lv) => Math.max(Math.abs(dx), Math.abs(dy)) <= lv.r,
    exactSphere: (dx, dy, lv) => Math.max(Math.abs(dx), Math.abs(dy)) === lv.r,
    bound: lv => lv.r,
  },
  // Kepler: A·dx² + B·dx·dy + C·dy² ≤ D  (B² < 4AC). B ≠ 0 → döndürülmüş elips.
  ell: {
    inBall: (dx, dy, lv) => { const { A, B, C, D } = par(lv, 'ell'); return A * dx * dx + B * dx * dy + C * dy * dy <= D; },
    bound: lv => {
      const { A, B, C, D } = par(lv, 'ell'), det = 4 * A * C - B * B;
      return Math.ceil(Math.sqrt(4 * Math.max(A, C) * D / det));
    },
  },
  // Squircle: |dx|^p + |dy|^p ≤ T  (p tam sayı, ör. 3 ya da 4)
  lp: {
    inBall: (dx, dy, lv) => { const { p, T } = par(lv, 'lp'); return Math.abs(dx) ** p + Math.abs(dy) ** p <= T; },
    bound: lv => { const { p, T } = par(lv, 'lp'); return Math.floor(T ** (1 / p) + 1e-9); },
  },
  // Kara delik: √a + √b ≤ √R  ⇔  s = R − a − b ≥ 0  ve  4ab ≤ s²   (kesin tam sayı aritmetiği)
  bh: {
    inBall: (dx, dy, lv) => {
      const { R } = par(lv, 'bh'), a = Math.abs(dx), b = Math.abs(dy), s = R - a - b;
      return s >= 0 && 4 * a * b <= s * s;
    },
    bound: lv => par(lv, 'bh').R,
  },
};
const NORMS = Object.keys(NORM_DEFS);

// ---------- gezegenler (ızgara karakterleri) ----------
const TILE_NORM = { a: 'l1', b: 'l2', c: 'linf', d: 'ell', e: 'lp', f: 'bh' };
const MIRROR = { l1: 'linf', linf: 'l1' };   // ayna gezegen 'm': dual normlar
const BLOCK = { '#': 1, k: 1, j: 1 };        // inilemez (üstünden uçulur): boşluk, sapan, dev
const SPECIAL_TILES = 'abcdefmkjio';
const landable = ch => !BLOCK[ch];
// ch karesine inince norm ne olur?
function landNorm(ch, n, ignoreTiles = false) {
  if (ignoreTiles) return n;
  if (TILE_NORM[ch]) return TILE_NORM[ch];
  if (ch === 'm') return MIRROR[n] || n;
  return n;
}

// Yarıçapı f katına çıkarılmış bölüm parametreleri (sapan güçlendirmesi, ışık).
function scaled(lv, n, f) {
  if (f === 1) return lv;
  const o = { ...lv };
  if (n === 'l1' || n === 'linf') o.r = lv.r * f;
  else if (n === 'l2') { o.r2 = r2Of(lv) * f * f; o.r = (lv.r || 0) * f; }
  else if (n === 'ell') { const q = par(lv, 'ell'); o.ell = { ...q, D: q.D * f * f }; }
  else if (n === 'lp') { const q = par(lv, 'lp'); o.lp = { ...q, T: q.T * f ** q.p }; }
  else if (n === 'bh') o.bh = { R: par(lv, 'bh').R * f };
  return o;
}

// ---------- hamle vektörleri ----------
const _offCache = new Map();
// boost = 1 → sapan güçlendirmesi (yarıçap 2 kat)
function offsets(norm, lv, boost = 0) {
  const L2 = boost ? scaled(lv, norm, 2) : lv;
  const def = NORM_DEFS[norm], sphere = L2.mode === 'sphere';
  const ck = norm + '|' + L2.mode + '|' + JSON.stringify([L2.r, L2.r2, L2.ell, L2.lp, L2.bh]);
  if (_offCache.has(ck)) return _offCache.get(ck);
  const R = Math.ceil(def.bound(L2)), out = [];
  const inB = (x, y) => def.inBall(x, y, L2);
  for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
    if (!dx && !dy) continue;
    let ok;
    if (!sphere) ok = inB(dx, dy);
    else if (def.exactSphere) ok = def.exactSphere(dx, dy, L2);
    else ok = inB(dx, dy) && (!inB(dx + 1, dy) || !inB(dx - 1, dy) || !inB(dx, dy + 1) || !inB(dx, dy - 1));
    if (ok) out.push([dx, dy]);
  }
  _offCache.set(ck, out);
  return out;
}
// Yörünge (küre) vektörleri kümesi — halka kareleri için, mod ne olursa olsun.
const _sphCache = new Map();
function sphereSet(norm, lv, boost = 0) {
  const ck = norm + boost + JSON.stringify([lv.r, lv.r2, lv.ell, lv.lp, lv.bh]);
  if (!_sphCache.has(ck)) _sphCache.set(ck, new Set(offsets(norm, { ...lv, mode: 'sphere' }, boost).map(v => v + '')));
  return _sphCache.get(ck);
}

// Karakter ızgarasından çözücünün kullandığı yapı (kâşif bot inanç ızgarasıyla da çağırır).
function prepare(g) {
  let start, goal; const giants = [];
  g.forEach((row, y) => row.forEach((ch, x) => {
    if (ch === 'S') start = [x, y];
    if (ch === 'G') goal = [x, y];
    if (ch === 'j') giants.push([x, y]);
  }));
  return { g, start, goal, giants, h: g.length, w: g[0].length };
}
function parse(lv) { return prepare(lv.grid.map(s => s.split(''))); }

// ---------- durum ----------
// Durum: { x, y, n, b }  (b: sapan güçlendirmesi 0/1). Yeni alan eklenirse skey'e de ekle.
const skey = s => `${s.x},${s.y},${s.n},${s.b | 0}`;
const startState = (lv, P) => ({ x: P.start[0], y: P.start[1], n: lv.norm, b: 0 });
const isGoal = (s, P) => s.x === P.goal[0] && s.y === P.goal[1];

const inGrid = (P, x, y) => x >= 0 && y >= 0 && x < P.w && y < P.h;
function nearSling(P, x, y) {
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
    if ((dx || dy) && inGrid(P, x + dx, y + dy) && P.g[y + dy][x + dx] === 'k') return true;
  return false;
}
// Dev gezegen: ℓ∞ uzaklığı 2 olan kareye inen gemi 1 kare çekilir. Okuma sırasındaki ilk dev.
function giantPull(P, x, y) {
  for (const [gx, gy] of P.giants) {
    if (Math.max(Math.abs(x - gx), Math.abs(y - gy)) !== 2) continue;
    const tx = x - Math.sign(x - gx), ty = y - Math.sign(y - gy), ch = P.g[ty][tx];
    return landable(ch) && ch !== 'o' ? [tx, ty] : null;
  }
  return null;
}

// s durumundan yapılabilecek bütün hamleler: [{ x, y, n, b, via: [[x,y], ...], slid, pulled }]
// via[0] iniş karesi (oyuncunun dokunduğu), son eleman hamlenin bittiği kare.
function step(lv, P, s, ignoreTiles = false) {
  const out = [];
  for (const [dx, dy] of offsets(s.n, lv, s.b)) {
    let x = s.x + dx, y = s.y + dy;
    if (!inGrid(P, x, y)) continue;
    const ch = P.g[y][x];
    if (!landable(ch)) continue;
    if (ch === 'o' && !ignoreTiles && !sphereSet(s.n, lv, s.b).has(dx + ',' + dy)) continue;
    const via = [[x, y]];
    let pulled = false;
    if (!ignoreTiles) {
      if (ch === 'i') {   // buz: aynı vektörle kaymaya devam
        while (P.g[y][x] !== 'G') {
          const nx = x + dx, ny = y + dy;
          if (!inGrid(P, nx, ny) || !landable(P.g[ny][nx]) || P.g[ny][nx] === 'o') break;
          x = nx; y = ny; via.push([x, y]);
        }
      }
      const pull = P.giants.length && P.g[y][x] !== 'G' && giantPull(P, x, y);   // üse inen kenetlenir
      if (pull) { [x, y] = pull; via.push([x, y]); pulled = true; }
    }
    out.push({ x, y, n: landNorm(P.g[y][x], s.n, ignoreTiles), b: !ignoreTiles && nearSling(P, x, y) ? 1 : 0, via,
      slid: ch === 'i' && via.length > 1 + pulled, pulled });
  }
  return out;
}

// BFS (P hazır). En kısa yolu (durum listesi, from dahil) ya da null döndürür.
function bfsPath(lv, P, s0, ignoreTiles = false) {
  const prev = new Map([[skey(s0), null]]), q = [s0];
  for (let i = 0; i < q.length; i++) {
    const s = q[i];
    if (isGoal(s, P)) {
      const path = [];
      for (let cur = s; cur; cur = prev.get(skey(cur))) path.unshift(cur);
      return path;
    }
    for (const t of step(lv, P, s, ignoreTiles)) {
      const k = skey(t);
      if (prev.has(k)) continue;
      prev.set(k, s); q.push(t);
    }
  }
  return null;
}
function solvePath(lv, from = null, ignoreTiles = false) {
  const P = parse(lv);
  return bfsPath(lv, P, from || startState(lv, P), ignoreTiles);
}
// En kısa çözümün hamle sayısı ya da -1.
function solve(lv, ignoreTiles = false) {
  const p = solvePath(lv, null, ignoreTiles);
  return p ? p.length - 1 : -1;
}

// ---------- Karanlık Bulutsu: ışık ve kâşif bot ----------
// Işık = o anki normun topu, yarıçap + 1 (mod ne olursa olsun top). Sapan güçlendirmesi ışığı da büyütür.
function lightOffsets(n, lv, boost = 0) {
  const B = boost ? scaled(lv, n, 2) : lv;
  let L;
  if (n === 'l1' || n === 'linf') L = { ...B, r: B.r + 1 };
  else if (n === 'l2') { const r = Math.sqrt(r2Of(B)); L = { ...B, r2: (r + 1) * (r + 1), r: r + 1 }; }
  else { const bd = NORM_DEFS[n].bound(B); L = scaled(B, n, (bd + 1) / bd); }
  return offsets(n, { ...L, mode: 'ball' }).concat([[0, 0]]);
}
// (x, y)'de n normundaki ışığın aydınlattığı kareler → seen kümesine ekler
function illuminate(lv, P, s, seen) {
  for (const [dx, dy] of lightOffsets(s.n, lv, s.b)) {
    const x = s.x + dx, y = s.y + dy;
    if (inGrid(P, x, y)) seen.add(x + ',' + y);
  }
  return seen;
}
// Kâşif bot: görmediği kareleri boş kaya sanar, inancına göre en kısa yolu planlar, ilk hamleyi yapar,
// yeni kareler görünce yeniden planlar. Hamle sayısını (ya da -1) döndürür.
function explore(lv, limit = 300) {
  const P = parse(lv), seen = new Set([P.goal + '']);
  let s = startState(lv, P), moves = 0;
  illuminate(lv, P, s, seen);
  while (!isGoal(s, P)) {
    if (moves >= limit) return -1;
    const belief = prepare(P.g.map((row, y) => row.map((ch, x) => seen.has(x + ',' + y) ? ch : '.')));
    const plan = bfsPath(lv, belief, s);
    if (!plan) return -1;
    const [lx, ly] = plan[1].via[0];
    const real = step(lv, P, s).find(m => m.via[0][0] === lx && m.via[0][1] === ly);
    if (!real) return -1;   // olmamalı: iniş karesi her zaman ışığın içinde
    s = { x: real.x, y: real.y, n: real.n, b: real.b };
    moves++;
    for (const [x, y] of real.via) illuminate(lv, P, { ...s, x, y }, seen);
  }
  return moves;
}

let prefsReady = !Prefs;
const prefsPending = new Map();
function mirror(k, v) {
  if (!Prefs) return;
  if (!prefsReady) { prefsPending.set(k, v); return; }
  (v === null ? Prefs.remove({ key: k }) : Prefs.set({ key: k, value: v })).catch(() => {});
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, String(v)); } catch (e) {} mirror(KEY + k, String(v)); },
  remove(k) { try { localStorage.removeItem(KEY + k); } catch (e) {} mirror(KEY + k, null); },
  int(k, d) { const n = parseInt(this.get(k, String(d)), 10); return Number.isFinite(n) ? n : d; },
};
async function restoreFromBackup() {
  if (!Prefs) return;
  const intact = store.get('alive', '') === '1';
  let restored = 0;
  if (!intact) {
    try {
      const { keys } = await Prefs.keys();
      for (const k of keys.filter(k => k.startsWith(KEY))) {
        const { value } = await Prefs.get({ key: k });
        if (value !== null) { localStorage.setItem(k, value); restored++; }
      }
    } catch (e) {}
  }
  try { localStorage.setItem(KEY + 'alive', '1'); } catch (e) {}
  if (restored) return location.reload();
  prefsReady = true;
  for (const [k, v] of prefsPending) mirror(k, v);
  prefsPending.clear();
}

// Analytics olayı. Adlar kısa, sabit, kişisel veri içermez.

// Reklam birimleri (AdMob yayıncı pub-2327448683756849). Uygulama kimlikleri: iOS ~9755313818 (Info.plist),
// Android ~8442232147 (manifest, Android eklenince). Geliştirme cihazları AdMob → Test cihazları'nda kayıtlı.
const AD_UNITS = {
  ios:     { rewarded: 'ca-app-pub-2327448683756849/2078848829', interstitial: 'ca-app-pub-2327448683756849/9682006673' },
  android: { rewarded: 'ca-app-pub-2327448683756849/7396743788', interstitial: 'ca-app-pub-2327448683756849/2878914275' },
};
function adUnits() {
  const platform = window.Capacitor && window.Capacitor.getPlatform ? window.Capacitor.getPlatform() : 'web';
  const u = AD_UNITS[platform];
  return u && u.rewarded && u.interstitial ? u : null;
}

// İzin akışı: önce Google UMP (AB/İngiltere'de izin penceresi), sonra iOS izleme izni (ATT).
// Firebase izin modu: izin gerekmeyen bölgelerde açık; AB/İngiltere'de temkinli → kapalı.
const Consent = {
  async run() {
    if (!AdMobP) return false;
    let info = null;
    try {
      info = await AdMobP.requestConsentInfo();
      if (info.isConsentFormAvailable && info.status === 'REQUIRED') info = await AdMobP.showConsentForm();
    } catch (e) {}
    $('privacyChoicesBtn').style.display = info && info.privacyOptionsRequirementStatus === 'REQUIRED' ? '' : 'none';
    const outside = !!info && info.status === 'NOT_REQUIRED';
    if (FA) for (const type of ['ANALYTICS_STORAGE', 'AD_STORAGE', 'AD_USER_DATA', 'AD_PERSONALIZATION'])
      FA.setConsent({ type, status: outside ? 'GRANTED' : 'DENIED' }).catch(() => {});
    try {
      const { status } = await AdMobP.trackingAuthorizationStatus();
      if (status === 'notDetermined') await AdMobP.requestTrackingAuthorization();
    } catch (e) {}
    return !!info && info.canRequestAds;
  },
};

// Reklamlar. Önceden yüklenir; hazır değilse geçiş reklamı atlanır, ödüllü reklamın hakkı yine verilir.
// Stüdyo dersi (2026-11-14): AÇILIŞTA YÜKLEME YAPMA (ilk oyunu takıltıyor). İlk sonuç ekranında ya da 25 sn sonra.
const NativeAds = {
  ready: null, units: null,
  loaded: { rewarded: false, interstitial: false },
  loading: { rewarded: null, interstitial: null },
  init() {
    if (!this.ready) this.ready = (async () => {
      if (!(await Consent.run())) return false;
      this.units = adUnits();
      if (!this.units) return false;
      await AdMobP.initialize({});
      if (this.wantWarm) this.warm(); else this.warmTimer = setTimeout(() => this.warm(), 25000);
      return true;
    })().catch(() => false).then(ok => { if (!ok) this.ready = null; return ok; });
    return this.ready;
  },
  warm() {
    this.wantWarm = true;
    if (this.warmed || !this.units) return;
    this.warmed = true; clearTimeout(this.warmTimer);
    this.prepare('rewarded');
    setTimeout(() => this.prepare('interstitial'), 1500);   // ikisi aynı anda yüklenmesin
  },
  prepare(kind) {
    this.loaded[kind] = false;
    const p = kind === 'rewarded'
      ? AdMobP.prepareRewardVideoAd({ adId: this.units.rewarded })
      : AdMobP.prepareInterstitial({ adId: this.units.interstitial });
    this.loading[kind] = p.then(() => { this.loaded[kind] = true; })
      .catch(() => setTimeout(() => this.prepare(kind), 60000))   // reklam bulunamadı → 1 dk sonra
      .finally(() => { this.loading[kind] = null; });
  },
  // Olay tabanlı: "show" sözü yalnız ödülde döner, kapatmada dönmez. null = reklam yok.
  show(kind) {
    return new Promise(async resolve => {
      if (!(await this.init())) return resolve(null);
      this.warm();
      if (!this.loaded[kind] && this.loading[kind]) await Promise.race([this.loading[kind], new Promise(r => setTimeout(r, 8000))]);
      if (!this.loaded[kind]) return resolve(null);
      const ev = kind === 'rewarded'
        ? { reward: 'onRewardedVideoAdReward', end: 'onRewardedVideoAdDismissed', fail: 'onRewardedVideoAdFailedToShow' }
        : { end: 'interstitialAdDismissed', fail: 'interstitialAdFailedToShow' };
      let rewarded = false;
      const hs = [];
      const finish = ok => { hs.forEach(h => h.remove()); this.prepare(kind); resolve(ok); };
      if (ev.reward) hs.push(await AdMobP.addListener(ev.reward, () => { rewarded = true; }));
      hs.push(await AdMobP.addListener(ev.end, () => finish(kind === 'rewarded' ? rewarded : true)));
      hs.push(await AdMobP.addListener(ev.fail, () => finish(null)));
      this.loaded[kind] = false;
      (kind === 'rewarded' ? AdMobP.showRewardVideoAd() : AdMobP.showInterstitial()).catch(() => {});
    });
  },
};

// Sıklık −2048 ile uyumlu (sahip orada daha sık reklam istedi).
const AD_RULES = {
  // −2048 1.1 ile birebir (sahip, 2026-11-20; −2048 çıkınca onun verisine göre ayarlanacak)
  FREE_LEVELS: 3,        // ilk 3 bölüm reklamsız (galaksideki sırası değil, oyundaki sırası)
  EVERY_ATTEMPTS: 3,     // her 3 denemede (bölüm başlatma, tekrar dahil) bir geçiş reklamı ("Sonraki"ye basınca)
  MIN_GAP_SEC: 120,      // iki reklam arası en az 2 dk
  HINTS_FREE: 3,         // oyunun tamamı için toplam ücretsiz ipucu (galaksi ve günün bulmacası ortak; sahip, 2026-11-20)
};
const adState = {
  get attempts() { return store.int('ad-attempts', 0); }, set attempts(v) { store.set('ad-attempts', v); },
  get lastAt() { return store.int('ad-last', 0); }, set lastAt(v) { store.set('ad-last', v); },
  get skipNext() { return store.get('ad-skip', '') === '1'; }, set skipNext(v) { store.set('ad-skip', v ? '1' : ''); },
};
const Ads = {
  // Ödüllü: onay zaten "İpucun kalmadı" penceresinde alındı. Reklam yüklenemediyse ya da hazır değilse
  // (tarayıcı dahil) oyuncu cezalandırılmaz, hak yine verilir; reklamı yarıda kapatırsa verilmez.
  rewarded(done) {
    NativeAds.show('rewarded').then(r => {
      const watched = r !== null, granted = r === null || r;
      if (watched) { adState.lastAt = Date.now(); adState.skipNext = true; }
      track('ad_reward', { granted: granted ? 1 : 0, shown: watched ? 1 : 0 });
      done(granted);
    });
  },
  // Geçiş: hazır değilse atlanır.
  interstitial(done) {
    NativeAds.show('interstitial').then(r => { if (r) { adState.lastAt = Date.now(); track('ad_interstitial'); } done(); });
  },
};
// Geçiş reklamı YALNIZCA buradan: kazandıktan sonra "Sonraki"ye basınca. Oyun ortasında, açılışta asla.
function maybeInterstitial(then) {
  const due = cur + 1 > AD_RULES.FREE_LEVELS && adState.attempts >= AD_RULES.EVERY_ATTEMPTS
    && (Date.now() - adState.lastAt) / 1000 >= AD_RULES.MIN_GAP_SEC;
  if (!due) return then();
  adState.attempts = 0;
  if (adState.skipNext) { adState.skipNext = false; return then(); }   // ödüllü izlendi → bu sefer atla
  Ads.interstitial(then);

function dailyPuzzle(n) {

  const last = store.int('daily-last', 0), s = store.int('daily-streak', 0), today = todayNumber();

function dailyWin(m, stars) {
  const n = L.daily;
  // alan şekli dizisi (her hamleden sonraki norm) — konum vermez, hikâyeyi anlatır
  const seq = hist.slice(1).map(h => h.n).concat(st.n);
  const old = dailyRes(n);
  const better = !old || stars > old.stars || (stars === old.stars && m < old.m);
  if (better) store.set('daily-res-' + n, JSON.stringify({ m, stars, hints: dailyHints, seq, par: L.par, theme: L.theme, date: L.date }));
  if (old && better) setTimeout(() => toast(t('daily.better')), 600);
  if (!old) {   // ilk çözüş: seri
    const last = store.int('daily-last', 0);
    const s = last === n - 1 ? store.int('daily-streak', 0) + 1 : last === n ? store.int('daily-streak', 0) : 1;
    store.set('daily-streak', s); store.set('daily-last', n);
    store.set('daily-best', Math.max(store.int('daily-best', 0), s));
    track('daily_win', { n, moves: m, stars, hints: dailyHints });

}

   </g></g></g>`;
const SUN_DEFS =
  `<radialGradient id="gSun" cx="40%" cy="38%" r="65%"><stop offset="0" stop-color="#fffbe8"/><stop offset=".55" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffb98a"/></radialGradient>
   <radialGradient id="gSunGlow"><stop offset="0" stop-color="#ffd97a" stop-opacity=".42"/><stop offset="1" stop-color="#ffd97a" stop-opacity="0"/></radialGradient>
   <radialGradient id="gSling"><stop offset="0" stop-color="#7ccfd6" stop-opacity=".16"/><stop offset="1" stop-color="#7ccfd6" stop-opacity="0"/></radialGradient>`;
// Özel zemin kareleri (buz, halka) — tahtada ve tanıtım kartında ortak.
const ICE_SVG = `<rect class="pad ice" x="-.42" y="-.42" width=".84" height=".84" rx=".22"/>
   <path d="M-.22 .12L.1 -.2M-.08 .22L.22 -.08" stroke="#fff" stroke-opacity=".55" stroke-width=".04" stroke-linecap="round"/>`;
const RING_SVG = `<rect class="pad" x="-.42" y="-.42" width=".84" height=".84" rx=".22"/>
   <ellipse rx=".3" ry=".095" transform="rotate(-20)" fill="none" stroke="var(--goal)" stroke-opacity=".9" stroke-width=".04"/>
   <circle r=".055" fill="var(--goal)"/>`;
// Tanıtım kartı resmi. Yeni kavramlar (kalkış, alan şekilleri, yörünge, gezegenler) yalnızca burada;
// cardArtSVG galaksi amblemlerinde de kullanılır, ona dokunma (Fırlatma Rampası amblemi bozulmuştu, 2026-11-15).
function introArtSVG(k) {
  const fieldArt = (n, extra) => `<g style="color:var(--${n})">${shapeSVG(n, .48, '', extra)}</g><circle r=".07" fill="#fff"/>`;
  if (k === 'start') return `<g transform="scale(1.25)">${ROCKET_SVG.replace(/ id="ship\w+"/g, '')}</g>`;
  if (k === 'l1' || k === 'l2') return fieldArt(k, 'fill="currentColor" fill-opacity=".3" stroke="currentColor" stroke-width=".05" stroke-linejoin="round"');
  if (k === 'orbit') return fieldArt('l2', 'fill="none" stroke="currentColor" stroke-width=".05" stroke-dasharray=".12 .08"');
  if (k === 'planets') return [['l1', -.33, .2], ['l2', 0, -.2], ['linf', .33, .2]]
    .map(([n, x, y]) => `<g transform="translate(${x} ${y}) scale(.5)">${planetSVG(n)}</g>`).join('');
  return cardArtSVG(k);
}
function cardArtSVG(k) {
  if (k === 'i') return ICE_SVG;
  if (k === 'o') return RING_SVG;
  if (k === 'dark') return SUN_SVG.replace(/ id="ship\w+"/g, '');
  return planetSVG(k);
}

function buildBoard() {
  const { w, h } = P, m = .28, rnd = rng(L.id), dark = !!L.dark;
  sky.setAttribute('viewBox', `${-m} ${-m} ${w + 2 * m} ${h + 2 * m}`);
  let stars = '';
  const N = Math.round((w + 1) * (h + 1) * 2.2);
  for (let i = 0; i < N; i++) {
    const x = -m + rnd() * (w + 2 * m), y = -m + rnd() * (h + 2 * m), r = .008 + rnd() * rnd() * .035;
    const tw = rnd() < .12 ? ` class="star tw" style="animation-delay:${(rnd() * 4).toFixed(2)}s"` : ` class="star" opacity="${(.25 + rnd() * .55).toFixed(2)}"`;
    stars += `<circle cx="${x.toFixed(3)}" cy="${y.toFixed(3)}" r="${r.toFixed(3)}"${tw}/>`;
  }
  let zones = '', pads = '', things = '', hits = '', fog = '';
  const at = (x, y, svg) => `<g transform="translate(${x + .5} ${y + .5})">${svg}</g>`;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = P.g[y][x];
    if (dark && ch !== 'G') fog += `<rect class="fogc" id="fog-${x}-${y}" x="${x - .03}" y="${y - .03}" width="1.06" height="1.06"/>`;
    if (ch === '#') continue;
    if (ch === 'k') {   // sapan: inilemez; çevresinde yumuşak bölge (kare değil: şekil = norm)
      zones += `<circle cx="${x + .5}" cy="${y + .5}" r="1.55" fill="url(#gSling)"/>`;
      things += at(x, y, planetSVG('k')); continue;
    }
    if (ch === 'j') { things += at(x, y, planetSVG('j')); continue; }
    if (ch === 'i') { pads += at(x, y, ICE_SVG); }
    else if (ch === 'o') { pads += at(x, y, RING_SVG); }
    else {
      pads += `<rect class="pad" x="${x + .08}" y="${y + .08}" width=".84" height=".84" rx=".22"/>`;
      if (ch === '.' && rnd() < .55) {   // kaya dokusu: birkaç krater
        const k = 1 + (rnd() < .4);
        for (let i = 0; i < k; i++) pads += `<circle class="crater" cx="${(x + .25 + rnd() * .5).toFixed(2)}" cy="${(y + .25 + rnd() * .5).toFixed(2)}" r="${(.04 + rnd() * .05).toFixed(3)}"/>`;
      }
    }
    // dev gezegenin çekim alanı: çekilen karelerde deve dönük küçük ok
    if (P.giants.length && ch !== 'G') {
      const pull = giantPull(P, x, y);
      if (pull) pads += `<path class="pull" d="M-.07 -.07L.03 0L-.07 .07" transform="translate(${x + .5} ${y + .5}) rotate(${Math.atan2(pull[1] - y, pull[0] - x) * 180 / Math.PI}) translate(.25 0)"/>`;
    }
    if (ch === 'S') pads += `<circle class="launch" cx="${x + .5}" cy="${y + .5}" r=".3"/>`;
    if (TILE_NORM[ch] || ch === 'm') things += at(x, y, planetSVG(TILE_NORM[ch] || ch));
    if (ch === 'G') things += `<g transform="translate(${x + .5} ${y + .5})" id="goalG">${GOAL_SVG}</g>`;
    hits += `<rect class="hit" x="${x}" y="${y}" width="1" height="1" data-x="${x}" data-y="${y}"/>`;
  }
  const grad = (id, a, b, c) => `<radialGradient id="${id}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="${a}"/><stop offset=".55" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></radialGradient>`;
  sky.innerHTML = `
    <defs>
      <linearGradient id="gSpace" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="var(--space-1)"/><stop offset="1" stop-color="var(--space-2)"/></linearGradient>
      <radialGradient id="gNeb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d7b8f5" stop-opacity=".22"/><stop offset="1" stop-color="#d7b8f5" stop-opacity="0"/></radialGradient>
      ${grad('gl1', '#ffe2cc', '#ffb98a', '#e98e5c')}${grad('gl2', '#e3f1ff', '#8cc4f7', '#5d97d6')}${grad('glinf', '#dcf7e6', '#8fdcae', '#5bb283')}
      ${grad('gell', '#f1e8ff', '#cdb4f6', '#9a7fd6')}${grad('glp', '#ffe6f0', '#ffb3cf', '#df7fa5')}${grad('gm', '#ffffff', '#e3e8f2', '#aab3c5')}
      ${grad('gk', '#e2fbfc', '#7ccfd6', '#4c9fae')}${grad('gj', '#fbf0de', '#e3c49d', '#b98a63')}
      <linearGradient id="gbh" x1="0" x2="1"><stop offset="0" stop-color="#ffd2b0"/><stop offset=".5" stop-color="#cdb4f6"/><stop offset="1" stop-color="#8cc4f7"/></linearGradient>
      ${ROCKET_DEFS}${SUN_DEFS}
      <filter id="fogBlur" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation=".2"/></filter>
      <clipPath id="clipSky"><rect x="${-m}" y="${-m}" width="${w + 2 * m}" height="${h + 2 * m}" rx=".5"/></clipPath>
    </defs>
    <rect class="space-bg" x="${-m}" y="${-m}" width="${w + 2 * m}" height="${h + 2 * m}" rx=".5"/>
    <g clip-path="url(#clipSky)">
      <ellipse cx="${(w * (.2 + rnd() * .6)).toFixed(2)}" cy="${(h * (.2 + rnd() * .6)).toFixed(2)}" rx="${w * .55}" ry="${h * .35}" fill="url(#gNeb)" transform="rotate(${Math.round(rnd() * 60 - 30)} ${w / 2} ${h / 2})"/>
      ${stars}
      ${zones}
      ${pads}
      <g id="tints"></g>
      <g class="field-g" id="field"></g>
      ${things}
      ${dark ? `<g id="fog" filter="url(#fogBlur)">${fog}</g>` : ''}
      <g id="trails"></g>
      <g id="marks"></g>
      <g id="ship">${dark ? SUN_SVG : ROCKET_SVG}</g>
      <g id="fx"></g>
    </g>
    <rect class="space-rim" x="${-m}" y="${-m}" width="${w + 2 * m}" height="${h + 2 * m}" rx=".5"/>
    <g id="hits">${hits}</g>`;
}

// Karanlık: görülen karelerin sisini kaldır (kısa "açılma" animasyonuyla)
function revealFog(instant = false) {
  if (!L.dark) return;
  for (const k of seen) {
    const el = document.getElementById('fog-' + k.replace(',', '-'));
    if (!el || el.classList.contains('gone')) continue;
    if (instant) el.remove();
    else { el.classList.add('gone'); setTimeout(() => el.remove(), 700); }
  }
}

// Gidilebilir hamleler: oyuncunun dokunacağı kare = iniş karesi (via[0])
const moves = () => step(L, P, st);
const landingKey = m => m.via[0][0] + ',' + m.via[0][1];

const shapeName = n => t('shape.' + n);
function update(anim = true, reshape = false) {
  const n = st.n;
  $('app').className = 'n-' + n;
  sky.setAttribute('class', (L.mode === 'sphere' ? 'sphere ' : '') + (L.dark ? 'dark-level ' : '') + 'n-' + n + (st.b ? ' boosted' : '') + (anim ? '' : ' noanim'));
  // alan / yörünge şekli (sapan güçlendirmesinde 2 kat)
  const fieldG = $('field');
  fieldG.innerHTML = fieldSVG(n, st.b ? scaled(L, n, 2) : L);
  fieldG.style.transform = `translate(${st.x + .5}px, ${st.y + .5}px)`;
  fieldG.classList.toggle('hidden', !showField || won);
  if (reshape) { fieldG.classList.remove('reshape'); void fieldG.getBBox(); fieldG.classList.add('reshape'); }
  // gidilebilir kareler
  let marks = '', tints = '';
  if (!won) for (const mv of moves()) {
    const [x, y] = mv.via[0], ch = P.g[y][x];
    if (ch === '.' || ch === 'S') marks += `<circle class="dot" cx="${x + .5}" cy="${y + .5}" r=".09"/>`;
    else tints += `<rect class="tint" x="${x + .08}" y="${y + .08}" width=".84" height=".84" rx=".22"/>`;
  }
  // ilk bölüm (henüz bitirilmemişse): her hamlede doğru kare halkayla gösterilir, ipucu hakkı harcanmaz
  const tut = !hintKey && !won && tutorial() && solvePath(L, st);
  const mark = hintKey || (tut && tut.length > 1 ? tut[1].via[0].join(',') : null);
  if (mark) { const [x, y] = mark.split(',').map(Number); marks += `<circle class="hintmark" cx="${x + .5}" cy="${y + .5}" r=".4"/>`; }
  // öğretici: roketten halkaya kesikli çizgi; hamle çaprazsa metin bunu söyler (Furkan: "çapraz gitmeyi anlamadım", 2026-11-25)
  if (tut && tut.length > 1) {
    const [x, y] = tut[1].via[0], diag = x !== st.x && y !== st.y;
    marks = `<line class="tutline" x1="${st.x + .5}" y1="${st.y + .5}" x2="${x + .5}" y2="${y + .5}"/>` + marks;
    $('text').innerHTML = t(diag ? 'tut.diag' : 'tut.tap');
  }
  $('tints').innerHTML = tints;
  $('marks').innerHTML = marks;
  // gemi
  $('ship').style.transform = `translate(${st.x + .5}px, ${st.y + .5}px)`;
  $('shipRot').style.transform = `rotate(${L.dark ? 0 : angle}deg)`;
  // HUD
  $('fieldIcon').innerHTML = shapeSVG(n, 1, '', `fill="currentColor" fill-opacity=".25" stroke="currentColor" stroke-width=".26" stroke-linejoin="round"${L.mode === 'sphere' ? ' stroke-dasharray=".45 .3" fill-opacity="0"' : ''}`);
  $('fieldName').innerHTML = t(L.mode === 'sphere' ? 'mode.sphere' : 'mode.ball', { shape: shapeName(n) }) + (st.b ? ' <span class="boost">×2</span>' : '');
  $('moves').textContent = L.dark ? spent : hist.length;
  $('undoBtn').disabled = !hist.length || won;
  $('hintBtn').disabled = won;
  $('fieldBtn').classList.toggle('off', !showField);
  if (!anim) { void sky.getBoundingClientRect(); sky.classList.remove('noanim'); }
}

function addTrail(x0, y0, x1, y1) {
  const ln = document.createElementNS(NS, 'path');
  // hafif kavisli uçuş izi
  const mx = (x0 + x1) / 2 + .5, my = (y0 + y1) / 2 + .5, dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy) || 1;
  const bend = Math.min(.35, d * .12);
  ln.setAttribute('d', `M${x0 + .5} ${y0 + .5}Q${mx - dy / d * bend} ${my + dx / d * bend} ${x1 + .5} ${y1 + .5}`);
  ln.setAttribute('class', 'trail');
  $('trails').appendChild(ln);
  setTimeout(() => ln.remove(), 1200);
}
function hopAnim() {
  const hop = $('shipHop');
  hop.classList.remove('hop', 'land'); void hop.getBBox(); hop.classList.add('hop');
  setTimeout(() => { hop.classList.remove('hop'); hop.classList.add('land'); }, 380);
}
function turnTo(dx, dy) {
  const target = Math.atan2(dy, dx) * 180 / Math.PI + 90;
  angle += ((target - angle) % 360 + 540) % 360 - 180;
}
// Gemiyi ara noktalardan geçir (buzda kayma, dev çekimi), sonra done()
function flyVia(from, via, done) {
  const sh = $('ship'), fg = $('field');
  const put = ([x, y], dur) => {
    sh.style.transition = fg.style.transition = `transform ${dur}s cubic-bezier(.34,.12,.25,1)`;
    sh.style.transform = fg.style.transform = `translate(${x + .5}px, ${y + .5}px)`;
  };
  addTrail(from.x, from.y, via[0][0], via[0][1]);
  put(via[0], .38);
  let i = 1, prev = via[0];
  const next = () => {
    if (i >= via.length) { sh.style.transition = fg.style.transition = ''; return done(); }
    const p = via[i++]; addTrail(prev[0], prev[1], p[0], p[1]); prev = p;
    put(p, .17); Fx.slide(); setTimeout(next, 180);
  };
  setTimeout(next, via.length > 1 ? 380 : 0);
}

// ===================== UI =====================
// Öğretici: ilk bölüm ilk kez oynanırken
const tutorial = () => !!L && !L.daily && L.wi === 0 && L.li === 0 && !store.int(starKey(L.id), 0);
function load(i) {
  cur = Math.max(0, Math.min(i, LEVELS.length - 1)); store.set('cur', cur);
  startLevel(LEVELS[cur]);
}
// Ortak çekirdek: kampanya bölümü ya da günlük bulmaca
function startLevel(lv) {
  L = lv; P = parse(L); dailyHints = 0;
  st = startState(L, P);
  hist = []; won = false; hintKey = null; spent = 0; busy = false;
  seen = L.dark ? illuminate(L, P, st, new Set([P.goal + ''])) : null;
  // roket başta üsse doğru baksın
  angle = 0; turnTo(P.goal[0] - P.start[0], P.goal[1] - P.start[1]);
  buildBoard();
  revealFog(true);
  markFound();   // Gezegen Atlası
  syncDailyDot();
  refreshTexts();
  update(false);
  if (!NO_CARDS) queueIntros();
  if (!L.daily) adState.attempts = adState.attempts + 1;   // her başlatma bir deneme (tekrar dahil), −2048 gibi
  track('level_start', { id: L.id });
  syncHintBadge();
}
function refreshTexts() {
  if (!L) return;
  $('kicker').textContent = L.daily ? t('daily.kicker', { date: dailyDateLabel(L.date) })
    : `${t('hud.level', { n: L.li + 1 })} · ${lt(WORLDS[L.wi].name)}`;
  $('lvname').textContent = lt(L.name);
  $('text').innerHTML = tutorial() ? t('tut.tap') : lt(L.text);
  $('par').textContent = L.par;
  update(false);
}

function tryMove(x, y) {
  if (won || busy) return;
  const mv = moves().find(m => landingKey(m) === x + ',' + y);   // kural logic.js'te
  if (!mv) { if (P.g[y][x] !== '#' && (x !== st.x || y !== st.y)) Fx.nope(); return; }
  hist.push({ ...st, angle });
  spent++;
  const from = st, changed = mv.n !== from.n, mirror = P.g[mv.y][mv.x] === 'm';
  turnTo(x - from.x, y - from.y);
  Fx.hop(Math.hypot(x - from.x, y - from.y)); Fx.land();
  st = { x: mv.x, y: mv.y, n: mv.n, b: mv.b };
  hintKey = null; busy = true;
  $('marks').innerHTML = $('tints').innerHTML = '';
  $('shipRot').style.transform = `rotate(${L.dark ? 0 : angle}deg)`;
  hopAnim();
  flyVia(from, mv.via, () => {
    try {
      busy = false;
      if (L.dark) { for (const [vx, vy] of mv.via) illuminate(L, P, { ...st, x: vx, y: vy }, seen); revealFog(); }
      // tek bir bilgi balonu: norm değişimi > sapan > çekim > kayma
      let msg = '';
      if (changed) { Fx.gravity(mv.n); msg = mirror ? t('toast.mirror', { from: shapeName(from.n), to: shapeName(mv.n) }) : t('toast.gravity', { shape: shapeName(mv.n) }); }
      else if (mv.b) { Fx.gravity(st.n); msg = t('toast.boost'); }
      else if (mv.pulled) msg = t('toast.pull');
      else if (mv.slid) msg = t('toast.slide');
      // çıkmaz: buradan üsse yol yok → söyle ve Geri al'ı öne çıkar (sahip Geri al'ı hiç fark etmemişti)
      const stuck = !isGoal(st, P) && !solvePath(L, st);
      if (stuck) { msg = t('toast.noExit'); const u = $('undoBtn'); u.classList.remove('nudge'); void u.offsetWidth; u.classList.add('nudge'); }
      if (msg) { toast(msg); $('fieldChip').classList.remove('pop'); void $('fieldChip').offsetWidth; $('fieldChip').classList.add('pop'); }
      if (isGoal(st, P)) { won = true; update(true); celebrate(); return; }
      update(true, changed || mv.b !== from.b);
    } catch (e) {   // iniş sonrası bir hata oyunu kilitlemesin: durumu yine çiz (hata Crashlytics'e gider)
      busy = false; update(true, true); setTimeout(() => { throw e; });
    }
  });
}

function celebrate() {
  const perfect = (L.dark ? spent : hist.length) <= L.par;   // ★★★
  perfect ? Fx.perfect() : Fx.win();
  setTimeout(() => {
    const core = document.querySelector('.goal-core'); if (core) core.classList.add('won');
    const fx = $('fx'), [gx, gy] = P.goal;
    // alan şeklinde halkalar (kusursuzda 3, değilse 2)
    for (let i = 0; i < (perfect ? 4 : 2); i++) {
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('transform', `translate(${gx + .5} ${gy + .5})`);
      g.innerHTML = shapeSVG(st.n, .5, perfect && i % 2 ? 'burst gold' : 'burst', `style="animation-delay:${i * .18}s"`);
      fx.appendChild(g);
    }
    if (perfect) sky.classList.add('perfect');
    const N = perfect ? 34 : 14;
    for (let i = 0; i < N; i++) {
      const a = i / N * Math.PI * 2, d = .7 + Math.random() * (perfect ? 1.6 : .6);
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('class', 'spark' + (perfect && i % 2 ? ' alt' : '') + (perfect ? ' long' : '')); c.setAttribute('cx', gx + .5); c.setAttribute('cy', gy + .5); c.setAttribute('r', .05 + Math.random() * .04);
      c.style.setProperty('--tx', `${Math.cos(a) * d}px`); c.style.setProperty('--ty', `${Math.sin(a) * d}px`);
      fx.appendChild(c);
    }
  }, 360);
  // Sonuç penceresi tahtayı örter: kusursuzda kutlamanın tamamı görünsün diye daha geç (sahip, 2026-11-20)
  setTimeout(showWin, perfect ? 1900 : 1100);
}

const starKey = id => 'stars-' + id;
function showWin() {
  const m = L.dark ? spent : hist.length, p = L.par;   // karanlıkta geri al sayacı geri almaz
  const stars = m <= p ? 3 : m <= p + 2 ? 2 : 1;
  if (L.daily) return dailyWin(m, stars);
  store.set(starKey(L.id), Math.max(store.int(starKey(L.id), 0), stars));
  track('level_win', { id: L.id, moves: m, par: p, stars });
  if (Native) NativeAds.warm();
  // mutlu an: galaksinin son bölümü ilk kez bitti
  if (L.li === WORLDS[L.wi].levels.length - 1) maybeAskReview();
  $('winStars').innerHTML = [0, 1, 2].map(k => `<span class="${k < stars ? '' : 'off'}">★</span>`).join('');
  for (let k = 0; k < stars; k++) setTimeout(() => Fx.star(k), 200 + k * 180);
  $('winTitle').textContent = t(stars === 3 ? 'win.perfect' : 'win.good');
  // karanlıkta par = kâşif botun hamlesi; altına inilebilir. En kısa rota (bfs) ayrıca söylenir.
  let extra = '';
  if (stars < 3) extra = ' · ' + t('win.canBetter', { p });
  else if (L.dark) extra = ' · ' + (m <= L.bfs ? t('win.bestRoute') : (m < p ? t('win.beatPar') + ' ' : '') + t('win.route', { b: L.bfs }));
  $('winText').innerHTML = t('win.moves', { m }) + extra;
  winMode = 'level';
  $('nextBtn').textContent = cur < LEVELS.length - 1 ? t('win.next') : t('win.levels');
  $('retryBtn').textContent = t('win.retry');
  $('winExit').style.display = 'none';
  $('winDaily').style.display = dailyRes(todayNumber()) ? 'none' : '';   // bölüm bitti, günün bulmacası bekliyor
  $('winModal').classList.add('show');
}

function undo() {
  if (!hist.length || won || busy) return;
  Fx.undo(); $('undoBtn').classList.remove('nudge');
  const prev = hist.pop(), changed = prev.n !== st.n || prev.b !== st.b;
  addTrail(st.x, st.y, prev.x, prev.y);
  st = { x: prev.x, y: prev.y, n: prev.n, b: prev.b }; angle = prev.angle; hintKey = null;
  update(true, changed);   // karanlıkta: görülen kareler kalır, spent geri gitmez
}

// İpucu: logic.js'teki BFS ile şu anki durumdan en kısa yoldaki bir sonraki iniş karesi
function hint() {
  if (won || busy) return;
  if (hintKey) return;   // aynı ipucu zaten gösteriliyor: hak harcanmaz
  const path = solvePath(L, st);
  if (!path) { Fx.nope(); toast(t('toast.noExit')); return; }
  if (hintsLeft() <= 0) return openHintAd();
  if (freeHintsLeft() > 0) store.set('hints-used', store.int('hints-used', 0) + 1);
  else store.set('hint-bonus', bonusHints() - 1);
  showHint(path);
}
function showHint(path = solvePath(L, st)) {
  if (!path) return;
  hintKey = path[1].via[0].join(','); Fx.click();
  if (L.daily) dailyHints++;   // paylaşımda dürüstçe gösterilir
  track('hint_used', { id: L.id });
  syncHintBadge(); update(true);
}
// İpucu düğmesindeki rozet: kalan ücretsiz ipucu sayısı, bitince "▶" (reklam).
function syncHintBadge() {
  const b = $('hintBadge'); if (!b || !L) return;
  const n = hintsLeft();
  b.textContent = n > 0 ? n : '▶';
  b.classList.toggle('ad', n === 0);
}
function openHintAd() {
  $('hintAdMsg').textContent = t('hint.outBody', { n: AD_RULES.HINTS_FREE });
  $('hintAd').classList.add('show');
}
$('hintWatch').onclick = () => { Fx.click(); $('hintAd').classList.remove('show'); Ads.rewarded(ok => { if (!ok) return; store.set('hint-bonus', bonusHints() + 1); syncHintBadge(); Fx.star(0); toast(t('hint.granted')); }); };
$('hintNo').onclick = () => { Fx.click(); $('hintAd').classList.remove('show'); };

let toastT;
function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1500); }

// --- bölüm ekranı ---
const galaxyLevels = wi => LEVELS.filter(l => l.wi === wi);
const galaxyStars = wi => galaxyLevels(wi).reduce((a, l) => a + store.int(starKey(l.id), 0), 0);
const embSVG = (wi, cls = '') => `<svg class="${cls}" viewBox="-.62 -.62 1.24 1.24">${cardArtSVG(WORLDS[wi].emblem || 'l2')}</svg>`;

// Tahtanın küçük resmi (kare çerçeve, ortalanmış). Karanlık bölümde yalnızca başlangıç ve üs görünür (keşif bozulmasın).
const THUMB_COL = { a: 'var(--l1)', b: 'var(--l2)', c: 'var(--linf)', d: 'var(--ell)', e: 'var(--lp)', f: 'var(--bh)', m: 'var(--mirror)', k: '#7ccfd6', j: '#e3c49d', i: '#d6f0ff', o: 'var(--goal)', G: 'var(--goal)', S: '#ffffff' };
function thumbSVG(lv) {
  const h = lv.grid.length, w = lv.grid[0].length, M = Math.max(w, h), ox = (M - w) / 2, oy = (M - h) / 2;
  let s = `<rect x="${-ox - .3}" y="${-oy - .3}" width="${M + .6}" height="${M + .6}" rx=".9" fill="${lv.dark ? '#0b0d19' : 'rgba(0,0,0,.18)'}"/>`;
  lv.grid.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '#' || (lv.dark && ch !== 'S' && ch !== 'G')) return;
    const f = THUMB_COL[ch] || 'rgba(255,255,255,.2)', round = 'abcdefkj'.includes(ch) ? .42 : .2;
    s += `<rect x="${x + .1}" y="${y + .1}" width=".8" height=".8" rx="${round}" fill="${f}"/>`;
  }));
  return `<svg class="th" viewBox="${-ox - .3} ${-oy - .3} ${M + .6} ${M + .6}">${s}</svg>`;
}

// 1) Galaksi kartları
let levelsWorld = 0;
function openLevels() {
  $('levels').classList.remove('grid');
  $('levelsTitle').textContent = t('levels.galaxies');
  renderDailyBar(); renderAtlasBar();
  const got = LEVELS.reduce((a, l) => a + store.int(starKey(l.id), 0), 0);
  $('levelsSub').textContent = t('levels.sub', { n: got, total: LEVELS.length * 3 });
  $('gcards').innerHTML = WORLDS.map((w, wi) => {
    const lvs = galaxyLevels(wi), s = galaxyStars(wi);
    const next = lvs.find(l => !store.int(starKey(l.id), 0));
    const btn = next ? t(next.li === 0 && !s ? 'levels.start' : 'levels.continue', { n: next.li + 1 }) : t('levels.title');
    return `<div class="gcard gspace${w.emblem === 'dark' ? ' dark-g' : ''}" data-wi="${wi}">
      ${embSVG(wi, 'emb')}
      <h3>${lt(w.name)}</h3>
      <div class="meta">${t('levels.count', { n: lvs.length })} · ★ ${s} / ${lvs.length * 3}</div>
      <div class="gprog"><i style="width:${s / lvs.length / 3 * 100}%"></i></div>
      <button class="btn gplay" data-wi="${wi}" data-i="${next ? LEVELS.indexOf(next) : ''}">${btn}</button>
    </div>`;
  }).join('');
  $('gdots').innerHTML = WORLDS.map(() => '<i></i>').join('');
  $('gcards').querySelectorAll('.gcard').forEach(c => c.onclick = () => { Fx.click(); openGrid(+c.dataset.wi); });
  $('gcards').querySelectorAll('.gplay').forEach(b => b.onclick = e => {
    e.stopPropagation(); Fx.click();
    if (b.dataset.i !== '') { $('levels').classList.remove('show'); return load(+b.dataset.i); }
    openGrid(+b.dataset.wi);
  });
  $('levels').classList.add('show');
  // bulunduğun galaksinin kartına kaydır
  const card = $('gcards').children[L && L.wi >= 0 ? L.wi : 0];
  $('gcards').scrollLeft = card.offsetLeft - ($('gcards').clientWidth - card.clientWidth) / 2;
  syncDots();
}
function syncDots() {
  const g = $('gcards'), cards = [...g.children];
  if (!cards.length) return;
  const mid = g.scrollLeft + g.clientWidth / 2;
  let best = 0;
  cards.forEach((c, i) => { if (Math.abs(c.offsetLeft + c.clientWidth / 2 - mid) < Math.abs(cards[best].offsetLeft + cards[best].clientWidth / 2 - mid)) best = i; });
  [...$('gdots').children].forEach((d, i) => d.classList.toggle('on', i === best));
}
$('gcards').addEventListener('scroll', syncDots, { passive: true });

// 2) Seçilen galaksinin bölüm ızgarası (üstte galaksi sekmeleri)
function openGrid(wi) {
  levelsWorld = wi;
  $('levels').classList.add('grid');
  $('levelsTitle').textContent = lt(WORLDS[wi].name);
  $('levelsSub').textContent = `★ ${galaxyStars(wi)} / ${galaxyLevels(wi).length * 3}`;
  $('gtabs').innerHTML = WORLDS.map((w, i) => `<button class="gtab${i === wi ? ' on' : ''}" data-wi="${i}">${embSVG(i)}${lt(w.name)}</button>`).join('');
  $('gtabs').querySelectorAll('.gtab').forEach(b => b.onclick = () => { Fx.click(); openGrid(+b.dataset.wi); });
  const on = $('gtabs').querySelector('.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  $('tgrid').innerHTML = galaxyLevels(wi).map(l => {
    const i = LEVELS.indexOf(l), s = store.int(starKey(l.id), 0);
    return `<button class="tile gspace${l.dark ? ' dark-g' : ''}${i === cur && !L.daily ? ' cur' : ''}" data-i="${i}" aria-label="${l.li + 1}">
      ${thumbSVG(l)}<span class="num">${l.li + 1}</span>
      <span class="stars">${[0, 1, 2].map(k => k < s ? '★' : '<span class="off">★</span>').join('')}</span></button>`;
  }).join('');
  $('tgrid').scrollTop = 0;
  $('tgrid').querySelectorAll('.tile').forEach(b => b.onclick = () => {
    Fx.click();
    $('levels').classList.remove('show'); load(+b.dataset.i);
  });
}
$('levelsBack').onclick = () => { Fx.click(); openLevels(); };

// --- Gezegen Atlası (sahip, 2026-11-15): her gezegen türü ilk kez bir bölümde görülünce keşfedilir.
// Keşfedilmeyenler siyah siluet + "???" (dokununca hangi galakside olduğu yazar). Halka (o) hiçbir bölümde yok, atlasta da yok.
const ATLAS = [['l1', 'a'], ['l2', 'b'], ['linf', 'c'], ['ell', 'd'], ['lp', 'e'], ['bh', 'f'], ['m', 'm'], ['k', 'k'], ['j', 'j'], ['i', 'i']]
  .map(([k, tile]) => ({ k, tile }));
const atlasArt = e => e.k === 'i' ? ICE_SVG : planetSVG(e.k);
const atlasTitle = e => t(['l1', 'l2', 'linf'].includes(e.k) ? 'atlas.' + e.k : 'intro.' + e.k + '.title');
const atlasBody = e => t(['l1', 'l2', 'linf'].includes(e.k) ? 'atlas.' + e.k + '.body' : 'intro.' + e.k + '.body');
// Eski oyuncular için: yıldız alınmış bir bölümde geçen gezegen de keşfedilmiş sayılır
const isFound = e => store.get('found-' + e.k, '') === '1' || LEVELS.some(l => store.int(starKey(l.id), 0) > 0 && l.grid.join('').includes(e.tile));
function markFound() {
  const g = L.grid.join(''), fresh = ATLAS.filter(e => g.includes(e.tile) && !isFound(e));
  fresh.forEach(e => store.set('found-' + e.k, '1'));
  if (fresh.length && ATLAS.every(isFound)) setTimeout(() => toast(t('atlas.all')), 1500);
}
function renderAtlasBar() {
  const got = ATLAS.filter(isFound);
  $('atlasBar').innerHTML = `<span class="minis">${ATLAS.slice(0, 3).map(e => `<svg viewBox="-.62 -.62 1.24 1.24"${isFound(e) ? '' : ' style="filter:brightness(0)"'}>${atlasArt(e)}</svg>`).join('')}</span>
    <span class="tx"><b>${t('atlas.title')}</b><small>${t('atlas.count', { n: got.length, t: ATLAS.length })}</small></span>
    <span class="go">${t('atlas.open')}</span>`;
}
function atlasInfo(e) {
  if (!e) return $('atlasInfo').innerHTML = t('atlas.hint');
  if (isFound(e)) return $('atlasInfo').innerHTML = `<b class="t">${atlasTitle(e)}</b>${atlasBody(e)}`;
  const lv = LEVELS.find(l => l.grid.join('').includes(e.tile));
  $('atlasInfo').innerHTML = `<b class="t">???</b>${t('atlas.where', { g: lv ? lt(WORLDS[lv.wi].name) : '?' })}`;
}
function openAtlas() {
  const got = ATLAS.filter(isFound).length;
  $('atlasCount').textContent = t('atlas.count', { n: got, t: ATLAS.length });
  $('atlasGrid').innerHTML = ATLAS.map((e, i) => `<button class="atile${isFound(e) ? '' : ' unk'}" data-i="${i}">
    <svg viewBox="-.62 -.62 1.24 1.24">${atlasArt(e)}</svg><span>${isFound(e) ? atlasTitle(e) : '???'}</span></button>`).join('');
  $('atlasGrid').querySelectorAll('.atile').forEach(b => b.onclick = () => {
    Fx.click(); $('atlasGrid').querySelectorAll('.on').forEach(x => x.classList.remove('on')); b.classList.add('on'); atlasInfo(ATLAS[+b.dataset.i]);
  });
  atlasInfo(null);
  $('atlas').classList.add('show');
}
$('atlasBar').onclick = () => { Fx.click(); openAtlas(); };
$('atlasClose').onclick = () => { Fx.click(); $('atlas').classList.remove('show'); };

// --- tanıtım kartları: her yeni kavram ilk kez görülünce (her biri bir kez); "?" düğmesi bölümün kartlarını yeniden açar ---
// start: ilk bölüm (kare alan, üs, parlayan noktalar). l1/l2: elmas/daire alan. orbit: yörünge. planets: renkli gezegenler.
const INTRO_KINDS = ['start', 'l1', 'l2', 'orbit', 'planets', 'ell', 'lp', 'bh', 'm', 'k', 'j', 'i', 'o', 'dark'];
const FOUND_KINDS = ['planets', 'ell', 'lp', 'bh', 'm', 'k', 'j'];   // "yeni gezegen keşfedildi"
const cardQueue = [];
function levelKinds() {
  const ks = new Set(['start', L.norm]), g = L.grid.join('');
  if (L.mode === 'sphere') ks.add('orbit');
  if (/[abc]/.test(g)) ks.add('planets');
  // renkli gezegenler (a/b/c) "Gezegenler" kartıyla anlatılır; elmas/daire kartı yalnızca başlangıç alanı için
  for (const ch of g) { const n = TILE_NORM[ch]; if (n && !'abc'.includes(ch)) ks.add(n); if ('mkjio'.includes(ch)) ks.add(ch); }
  if (L.dark) ks.add('dark');
  return INTRO_KINDS.filter(k => ks.has(k));
}
function queueIntros(force = false) {
  let ks = levelKinds();
  // "?": bölüme en özgü kart önce (ör. gezegenler, sonra elmas alan); ilk karşılaşmada temelden ileriye
  if (force) { const rest = ks.filter(k => k !== 'start').reverse(); ks = rest.length ? rest : ['start']; }
  for (const k of ks) if ((force || store.get('seen-' + k, '') !== '1') && !cardQueue.includes(k)) cardQueue.push(k);
  if (!cardQueue.length || $('card').classList.contains('show')) return;
  if (force) nextCard(); else setTimeout(nextCard, 350);
}
function nextCard() {
  const k = cardQueue[0];
  if (!k || document.querySelector('.modal.show')) return;
  $('cardArt').innerHTML = introArtSVG(k);
  $('cardFound').textContent = FOUND_KINDS.includes(k) && store.get('seen-' + k, '') !== '1' ? t('intro.found') + ' · ' + t('atlas.added') : '';
  $('cardTitle').textContent = t(`intro.${k}.title`);
  $('cardBody').innerHTML = `<div>${t(`intro.${k}.body`)}</div>`;
  $('card').classList.add('show');
}
$('cardOk').onclick = () => {
  Fx.click(); store.set('seen-' + cardQueue.shift(), '1'); $('card').classList.remove('show');
  if (cardQueue.length) setTimeout(nextCard, 250);
};

function howShapes() {
  $('howShapes').innerHTML = ['l1', 'l2', 'linf'].map(n =>
    `<div><svg viewBox="-.6 -.6 1.2 1.2">${planetSVG(n)}</svg>${shapeName(n)}</div>`).join('');
}
function openHow() { howShapes(); $('howModal').classList.add('show'); }
$('fieldChip').onclick = () => { if (busy) return; Fx.click(); queueIntros(true); };

// --- ayarlar ---
function syncSwitches() {
  $('swSound').classList.toggle('on', Fx.sound);
  $('swHaptic').classList.toggle('on', Fx.haptic);
}
$('settingsBtn').onclick = () => { Fx.click(); syncSwitches(); Theme.apply(); $('settings').classList.add('show'); };
$('settingsClose').onclick = () => { Fx.click(); $('settings').classList.remove('show'); };
$('swSound').onclick = () => { store.set('sound', Fx.sound ? '0' : '1'); syncSwitches(); Fx.click(); };
$('swHaptic').onclick = () => { store.set('haptic', Fx.haptic ? '0' : '1'); syncSwitches(); Fx.buzz(20); };
document.querySelectorAll('#themeSeg button').forEach(b => b.onclick = () => { Fx.click(); store.set('theme', b.dataset.themeOpt); Theme.apply(); });
$('langBtn').onclick = () => { Fx.click(); $('settings').classList.remove('show'); renderLangList(); $('langModal').classList.add('show'); };
function backToSettings() { $('langModal').classList.remove('show'); $('settings').classList.add('show'); }
$('langBack').onclick = () => { Fx.click(); backToSettings(); };
$('howBtn').onclick = () => { $('settings').classList.remove('show'); openHow(); };
// Dış bağlantılar: uygulamada Safari'de açılır (Capacitor dış alanı yollar), tarayıcıda yeni sekme.
function openExternal(url) {
  Fx.click();
  if (Native) location.href = url;
  else window.open(url, '_blank', 'noopener');
}
$('supportBtn').onclick = () => openExternal(`${SITE}/support/#${lang}`);
$('privacyBtn').onclick = () => openExternal(`${SITE}/privacy/#${lang}`);
// AB'de zorunlu: izin tercihlerini sonradan değiştirme (UMP formu)
$('privacyChoicesBtn').onclick = () => { Fx.click(); if (AdMobP) AdMobP.showPrivacyOptionsForm().catch(() => {}); };
// Sorun bildir: e-posta uygulaması, teşhis bilgisi önceden yazılı (kişisel veri yok)
const SUPPORT_EMAIL = 'littlelemmastudio@gmail.com';
$('reportBtn').onclick = () => {
  const where = L && L.daily ? 'daily #' + L.daily : L ? L.id : '-';
  const body = t('report.body') + '\n\n\n---\n' + `${t('app.name')} ${VERSION} · ${where} · ${lang}\n${navigator.userAgent}`;
  openExternal(`mailto:${SUPPORT_EMAIL}?subject=${encodeURIComponent(t('app.name') + ' · ' + t('settings.report'))}&body=${encodeURIComponent(body)}`);
};
$('resetBtn').onclick = () => {
  if (!confirm(t('settings.resetConfirm'))) return;
  LEVELS.forEach(l => store.remove(starKey(l.id)));
  store.remove('seenHow'); INTRO_KINDS.forEach(k => store.remove('seen-' + k)); ATLAS.forEach(e => store.remove('found-' + e.k));
  $('settings').classList.remove('show'); load(0);
};

// --- oyun düğmeleri ---
// Tahta her yüklemede yeniden kurulduğu için tıklama sky üzerinden dinlenir.
sky.addEventListener('pointerdown', e => {
  const r = e.target.closest && e.target.closest('.hit');
  if (r) tryMove(+r.dataset.x, +r.dataset.y);
});
$('parChip').onclick = () => { Fx.click(); toast(L.dark ? t('toast.parDark', { p: L.par, b: L.bfs }) : t('toast.par', { p: L.par })); };
$('undoBtn').onclick = undo;
$('restartBtn').onclick = () => { Fx.undo(); load(cur); };
$('hintBtn').onclick = hint;
$('fieldBtn').onclick = () => { Fx.click(); showField = !showField; store.set('field', showField ? '1' : '0'); update(true); };
$('levelsBtn').onclick = () => { Fx.click(); openLevels(); };
$('levelsClose').onclick = () => { Fx.click(); $('levels').classList.remove('show'); };
$('howOk').onclick = () => { Fx.click(); $('howModal').classList.remove('show'); store.set('seenHow', '1'); if (cardQueue.length) setTimeout(nextCard, 250); };
$('retryBtn').onclick = () => {
  $('winModal').classList.remove('show');
  if (winMode === 'daily') { Fx.click(); $('levels').classList.remove('show'); return loadDaily(); }   // pencere galaksi ekranından açılmış olabilir   // günlük: tekrar oyna (en iyi sonuç saklanır)
  load(cur);
};
$('nextBtn').onclick = () => {
  if (winMode === 'daily') return shareDaily(dailyShown);
  $('winModal').classList.remove('show');
  if (cur >= LEVELS.length - 1) return openLevels();
  maybeInterstitial(() => load(cur + 1));
};
// Kazanma penceresinden çık (dışarı dokunma, geri tuşu, Esc): reklam yok, bölüm listesine
function winExit() {
  Fx.click(); $('winModal').classList.remove('show');
  openLevels();
  if (winMode === 'level' && L.wi >= 0) openGrid(L.wi);
}
$('winExit').onclick = winExit;
$('winDaily').onclick = () => { Fx.click(); $('winModal').classList.remove('show'); loadDaily(); };
// En üstteki pencereyi kapat. Dışarı dokunma, Esc ve Android geri tuşu aynı yolu kullanır. Reklam pencereleri kapanmaz.
function dismissTop(withLevels = false) {
  const open = id => $(id).classList.contains('show');
  if (open('langModal')) { backToSettings(); return true; }
  if (open('settings')) { $('settings').classList.remove('show'); return true; }
  if (open('howModal')) { $('howOk').click(); return true; }
  if (open('card')) { $('cardOk').click(); return true; }
  if (open('hintAd')) { $('hintNo').click(); return true; }
  if (open('atlas')) { $('atlas').classList.remove('show'); return true; }
  if (open('winModal')) { winExit(); return true; }
  if (withLevels && open('levels')) { if ($('levels').classList.contains('grid')) openLevels(); else $('levels').classList.remove('show'); return true; }
  return false;
}
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) dismissTop(); }));


// klavye (Mac / iPad): Z veya ⌫ geri al, R baştan, H ipucu
document.addEventListener('keydown', e => {
  if (document.querySelector('.modal.show') || $('levels').classList.contains('show')) {
    if (e.key === 'Escape') dismissTop(true);
    if (e.key === 'Enter' && $('winModal').classList.contains('show')) $('nextBtn').click();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === 'z' || k === 'backspace') undo();
  else if (k === 'r') load(cur);
  else if (k === 'h') hint();
});

// Android geri tuşu: en üstteki pencereyi kapat, yoksa uygulamayı arka plana al.
if (Native && Native.App) Native.App.addListener('backButton', () => { if (!dismissTop(true)) Native.App.minimizeApp(); });

// --- başlat ---
// Geliştirici/ekran görüntüsü kancası: index.html#lv=7&lang=tr&theme=dark&moves=2&how=0
const DEV = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
if (DEV.lang && LOCALES[DEV.lang]) { lang = DEV.lang; pluralRules = new Intl.PluralRules(lang); }
if (DEV.theme) { store.set('theme', DEV.theme); Theme.apply(); }
applyStatic();
load(DEV.lv ? +DEV.lv - 1 : store.int('cur', 0));
if (DEV.moves) { // en kısa çözümün ilk N hamlesini animasyonsuz oynar
  for (let i = 0; i < +DEV.moves; i++) {
    const path = solvePath(L, st); if (!path || path.length < 3) break;   // üsse varmadan dur
    const mv = path[1]; hist.push({ ...st, angle }); spent++;
    turnTo(mv.via[0][0] - st.x, mv.via[0][1] - st.y);
    st = { x: mv.x, y: mv.y, n: mv.n, b: mv.b };
    if (L.dark) for (const [vx, vy] of mv.via) illuminate(L, P, { ...st, x: vx, y: vy }, seen);
  }
  revealFog(true); update(false);
}
if (DEV.screen === 'levels') openLevels();
if (DEV.screen === 'grid') { openLevels(); openGrid(Math.max(0, L.wi)); }
if (DEV.screen === 'daily') loadDaily();
if (DEV.screen === 'atlas') { openLevels(); openAtlas(); }
// İlk açılışta yazı penceresi yok: "start" kartı + ilk bölümdeki öğretici işaret anlatır (Ayarlar → Nasıl oynanır? duruyor)
if (DEV.how === '1') setTimeout(openHow, 300);
restoreFromBackup();
setTimeout(() => Fx.create(), 0);
if (Native) setTimeout(() => NativeAds.init(), 1200);
</script>
