<style>
/* ===================== STİL =====================
   Görsel dil (2026-11-15, sahip The Almanac'ın tasarımını beğendi; ilham, kopya değil):
   krem kâğıt zemin, koyu mürekkep kenarlı kartlar ve sert kaymış gölgeler, düz pastel dolgular,
   eğik serif başlıklar, küçük monospace etiketler. Her dünyanın kendi pastel rengi var (--c / --cd). */
:root {
  --bg: #f4efe6; --paper: #fbf8f2; --ink: #2b2622; --muted: #7a7064; --line: #2b2622;
  --cell: #e8e1d5; --cell2: #efe9df;
  --p1: #a9c4ec; --p1d: #7d9fd6;   /* gök */
  --p2: #f4a29b; --p2d: #e07a72;   /* mercan */
  --p3: #f9c891; --p3d: #efa961;   /* şeftali */
  --p4: #aed9a8; --p4d: #84bf7d;   /* nane */
  --p5: #c4b8f0; --p5d: #9d8de0;   /* lavanta */
  --p6: #e8c7f0; --p6d: #cf9fdc;   /* leylak */
  --p7: #f5dc7a; --p7d: #e3bf3f;   /* limon */
  --board: #fbf8f2; --grid: rgba(43,38,34,.07); --grid-strong: rgba(43,38,34,.16); --axis: #2b2622; --tick: #7a7064; --outside: rgba(43,38,34,.07);
  --wall: #c4b8f0; --wall-ink: #2b2622; --gem: #a9c4ec; --gem-ink: #2b2622;
  --target: #f4a29b; --target-ink: #2b2622; --char: #2b2622; --path: #e0625a; --ghost: rgba(43,38,34,.18);
  --label: #fbf8f2; --label-ink: #2b2622; --danger: #c8443b; --star: #f2b630; --star-off: #d8d0c3; --overlay: rgba(43,38,34,.45);
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --sans: system-ui, -apple-system, "SF Pro Text", sans-serif;
  --hard: 0 3px 0 var(--line);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1916; --paper: #26221e; --ink: #f2ebdf; --muted: #a89e90; --line: #0d0b09;
    --cell: #34302a; --cell2: #2e2a25;
    --p1: #6f8fc4; --p1d: #4f6fa3; --p2: #c9736c; --p2d: #a4554f; --p3: #c99a5e; --p3d: #a67a42;
    --p4: #78a873; --p4d: #5a8756; --p5: #8c7fcb; --p5d: #6c5fae; --p6: #b48dc0; --p6d: #946ea1; --p7: #c4ab4c; --p7d: #a08a33;
    --board: #26221e; --grid: rgba(242,235,223,.05); --grid-strong: rgba(242,235,223,.13); --axis: #d9d0c2; --tick: #a89e90; --outside: rgba(0,0,0,.25);
    --wall: #8c7fcb; --wall-ink: #0d0b09; --gem: #6f8fc4; --gem-ink: #0d0b09;
    --target: #c9736c; --target-ink: #0d0b09; --char: #f2ebdf; --path: #ff8a7e; --ghost: rgba(242,235,223,.16);
    --label: #34302a; --label-ink: #f2ebdf; --star-off: #4a443c; --overlay: rgba(0,0,0,.6);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans);
  overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
.app { max-width: 560px; margin: 0 auto; height: 100%; display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 10px); }
.hidden { display: none !important; }
.serif { font-family: var(--serif); }
.mono { font-family: var(--mono); }
.card { background: var(--paper); border: 2px solid var(--line); border-radius: 16px; box-shadow: var(--hard); }
svg.ic { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Ana ekran ---------- */
#levels { overflow-y: auto; flex: 1; padding-bottom: 0; scrollbar-width: none; display: flex; flex-direction: column; }
#worlds, #endlessCard { flex: 1 0 auto; }
/* Alt menü (Bölümler · Ters bulmaca · Sonsuz) */
.tabbar { position: sticky; bottom: 0; display: flex; gap: 6px; padding: 6px; margin: 10px 0 2px; background: var(--paper); }
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 4px; border-radius: 11px;
  font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: var(--muted); }
.tabbar button svg.ic { width: 22px; height: 22px; }
.tabbar button.on { background: var(--ink); color: var(--paper); }
#levels::-webkit-scrollbar { display: none; }
.home-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px 2px; border-bottom: 2px solid var(--line); }
.brand { font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 32px; letter-spacing: -.01em; }
.score { font-family: var(--mono); font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.score b { color: var(--star); font-size: 18px; }
.tagline { font-family: var(--mono); font-size: 13px; color: var(--muted); margin: 10px 2px 16px; }
.wcard { margin-bottom: 18px; overflow: hidden; background: var(--c); }
.wcard .whead { display: flex; gap: 12px; align-items: flex-start; padding: 14px 14px 10px; }
.wcard .whead > div:first-child { flex: 1; }
.wcard h2 { font-family: var(--serif); font-weight: 600; font-size: 25px; margin: 0; letter-spacing: -.01em; color: #2b2622; }
.wcard p { font-family: var(--mono); font-size: 12.5px; margin: 4px 0 0; color: #2b2622; opacity: .8; }
.wicon { width: 54px; height: 54px; flex: none; border: 2px solid var(--line); border-radius: 13px; background: var(--paper); box-shadow: var(--hard); }
.wicon svg { width: 100%; height: 100%; display: block; }
.wlevels { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; padding: 2px 14px 14px; }
.lv { aspect-ratio: 1; border: 2px solid var(--line); border-radius: 11px; background: var(--paper); box-shadow: 0 2px 0 var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 700; font-size: 16px; gap: 1px; color: var(--ink); }
.lv:active { transform: translateY(2px); box-shadow: none; }
.lv small { font-size: 8px; letter-spacing: 1px; color: var(--star); line-height: 1; }
.lv small i { color: var(--star-off); font-style: normal; }
.lv.done { background: var(--cd); color: #2b2622; }
.lv.done small i { color: rgba(43,38,34,.3); }
.lv[disabled] { opacity: .35; cursor: default; }
.wfoot { background: var(--cd); border-top: 2px solid var(--line); padding: 7px 14px; font-family: var(--mono); font-size: 12.5px; font-weight: 700;
  display: flex; justify-content: space-between; color: #2b2622; }

/* ---------- Oyun ekranı ---------- */
#play { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 9px; }
.top { display: flex; align-items: center; gap: 10px; min-height: 46px; }
.top .back { width: 40px; height: 40px; display: grid; place-items: center; }
.top .ttl { flex: 1; text-align: center; line-height: 1.15; }
.top .title { font-family: var(--serif); font-weight: 600; font-size: 21px; }
.top .tries { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.top .best { min-width: 0; text-align: right; color: var(--star); font-size: 14px; letter-spacing: 1px; }
.top .best i { color: var(--star-off); font-style: normal; }
.boardWrap { position: relative; width: 100%; flex: 1 1 0; min-height: 220px; overflow: hidden; background: var(--board); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.camBtns { position: absolute; right: 8px; bottom: 10px; display: flex; flex-direction: column; gap: 7px; }
.camBtns button { width: 34px; height: 34px; border: 2px solid var(--line); border-radius: 10px; background: var(--paper); box-shadow: 0 2px 0 var(--line);
  display: grid; place-items: center; }
.camBtns button:active { transform: translateY(2px); box-shadow: none; }
.camBtns button.on { background: var(--p1); color: #2b2622; }
.camBtns svg.ic { width: 16px; height: 16px; }
.toast { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--paper); color: var(--danger);
  border: 2px solid var(--line); box-shadow: 0 2px 0 var(--line); padding: 5px 14px; border-radius: 999px; font-family: var(--mono); font-weight: 700; font-size: 13px;
  transition: opacity .25s; pointer-events: none; white-space: nowrap; }
.goals { display: flex; gap: 6px; flex-wrap: wrap; }
.goal { border: 2px solid var(--line); border-radius: 999px; padding: 3px 10px; font-family: var(--mono); font-size: 12px; font-weight: 700;
  display: flex; align-items: center; gap: 5px; color: var(--muted); background: var(--paper); }
.goal b { color: var(--star-off); font-size: 14px; }
.goal.on { color: #2b2622; background: #fbe3a0; } .goal.on b { color: #e0a400; }
.hint { font-size: 14px; line-height: 1.4; color: var(--muted); min-height: 19px; padding: 0 2px; }
.hint b { color: var(--ink); font-family: var(--serif); font-size: 15.5px; font-weight: 700; }
.hint { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.hintBtn { display: inline-flex; align-items: center; gap: 4px; border: 2px solid var(--line); border-radius: 999px; padding: 2px 10px 2px 6px;
  background: var(--paper); box-shadow: 0 2px 0 var(--line); font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--ink); }
.hintBtn svg.ic { width: 15px; height: 15px; }
.hintBtn:active { transform: translateY(2px); box-shadow: none; }
.hintBtn.pulse { animation: pulse 1.1s ease-in-out 3; background: #fbe3a0; color: #2b2622; }  /* 3 kez atar, sonra sarı kalır (ısrarcı olmasın) */
@keyframes pulse { 50% { transform: scale(1.08); } }
.hintText { flex-basis: 100%; }
.hintBtn.on { background: var(--p1); color: #2b2622; }
.hintBtn[disabled] { opacity: .45; }
.expr { min-height: 56px; padding: 8px 14px; display: flex; align-items: center; gap: 10px; }
.expr .txt { flex: 1; font-size: 26px; font-weight: 700; overflow-x: auto; white-space: nowrap; scrollbar-width: none; cursor: text; }
.expr .txt::-webkit-scrollbar { display: none; }
.expr .txt .caret { display: inline-block; width: 2px; height: 26px; background: var(--path); vertical-align: -4px; margin: 0 -1px; animation: blink 1s steps(2) infinite; }
.expr .txt .ph { color: var(--muted); opacity: .7; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 22px; }
.expr .txt .pc { padding: 0 1px; }
@keyframes blink { 50% { opacity: 0; } }
.expr .cost { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.expr .cost.err { color: var(--danger); }
.var { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 1.12em; }
.pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.pad.fns { grid-template-columns: repeat(7, 1fr); }
.k { height: 48px; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); box-shadow: var(--hard);
  font-size: 21px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-bottom: 3px; }
.k:active { transform: translateY(3px); box-shadow: none; }
.k.op { background: var(--cell); }
.k.fn { background: var(--p1); color: #2b2622; font-size: 17px; height: 40px; }
.k.fn.nav { background: var(--cell); color: var(--ink); }
.k.go { background: var(--p2); color: #2b2622; font-family: var(--serif); font-style: italic; font-size: 19px; }
.k[disabled] { opacity: .45; }
.pad.busy .k { pointer-events: none; opacity: .55; }

/* ---------- Sonuç penceresi ---------- */
.modal { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
.sheet { padding: 24px 20px 18px; width: 100%; max-width: 340px; text-align: center; }
.sheet h2 { margin: 0 0 4px; font-family: var(--serif); font-style: italic; font-size: 34px; font-weight: 700; }
.stars { font-size: 44px; letter-spacing: 8px; margin: 2px 0 8px; }
.stars span { color: var(--star-off); display: inline-block; transform: scale(.6); transition: transform .3s, color .3s; -webkit-text-stroke: 2px var(--line); }
.stars span.on { color: var(--star); transform: scale(1); }
.sheet p { margin: 4px 0; color: var(--muted); font-family: var(--mono); font-size: 13px; }
.sheet .row { display: flex; gap: 10px; margin-top: 18px; }
.sheet .row button { flex: 1; height: 48px; border: 2px solid var(--line); border-radius: 12px; box-shadow: var(--hard); background: var(--cell);
  font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 18px; }
.sheet .row button.main { background: var(--p2); color: #2b2622; }
.sheet .row button:active { transform: translateY(3px); box-shadow: none; }

/* ---------- Oyun hissi ---------- */
.boardWrap.shake { animation: shake .38s; }
@keyframes shake { 20% { transform: translate(-6px, 2px); } 40% { transform: translate(5px, -2px); } 60% { transform: translate(-4px, 1px); } 80% { transform: translate(3px, 0); } }
.goal.bump { animation: bump .32s; }
@keyframes bump { 40% { transform: scale(1.14); } }
.stars span.on { animation: starIn .5s cubic-bezier(.3, 1.7, .5, 1); }
@keyframes starIn { 0% { transform: translateY(-34px) scale(.3) rotate(-40deg); } 100% { transform: none; } }
.home-top .right { display: flex; align-items: center; gap: 10px; }
.iconbtn { width: 34px; height: 34px; border: 2px solid var(--line); border-radius: 10px; background: var(--paper); box-shadow: 0 2px 0 var(--line);
  display: grid; place-items: center; }
.iconbtn:active { transform: translateY(2px); box-shadow: none; }
.iconbtn.off { opacity: .45; }
.iconbtn.langbtn { width: auto; padding: 0 8px; font-family: var(--mono); font-weight: 700; font-size: 13px; }

/* ---------- Sonsuz mod ---------- */
.wfoot .playBtn { border: 2px solid var(--line); border-radius: 10px; background: var(--paper); box-shadow: 0 2px 0 var(--line);
  padding: 2px 14px; font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 15px; color: var(--ink); }
.wfoot .playBtn:active { transform: translateY(2px); box-shadow: none; }
.sheet.karne { max-width: 400px; }
.karne #karneCv { width: 100%; height: auto; border: 2px solid var(--line); border-radius: 12px; background: var(--board); display: block; margin: 6px 0 8px; }
.karne .kstat { font-family: var(--serif); font-size: 20px; color: var(--ink); font-weight: 700; }
.karne ol { text-align: left; max-height: 22vh; overflow-y: auto; margin: 4px 0 0; padding-left: 26px; font-size: 16px; }
.karne ol li { margin: 2px 0; }
.karne ol li::marker { font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* ---------- Ders penceresi ---------- */
.sheet.lesson { text-align: left; max-width: 390px; max-height: 92vh; overflow-y: auto; }
.lesson .ltag { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.lesson h2 { font-style: normal; font-size: 27px; margin: 2px 0 10px; }
.lgraph { border: 2px solid var(--line); border-radius: 12px; background: var(--board); overflow: hidden; }
.lgraph svg { display: block; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 9px 2px 4px; font-size: 17px; font-weight: 600; }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 20px; height: 0; border-top: 3px solid; }
.legend i.base { border-top-style: dashed; opacity: .6; }
.sheet .lbody { font-family: var(--sans); font-size: 15px; line-height: 1.5; color: var(--ink); margin: 8px 2px 0; }
.lbody .f, .legend .f { font-weight: 700; white-space: nowrap; }
.top .side { display: flex; align-items: center; gap: 6px; }
.top .help { width: 34px; height: 34px; border: 2px solid var(--line); border-radius: 10px; background: var(--paper); box-shadow: 0 2px 0 var(--line);
  font-family: var(--serif); font-weight: 700; font-size: 18px; display: grid; place-items: center; }
.top .help:active { transform: translateY(2px); box-shadow: none; }
</style>
</head>
<body>
<div class="app">
  <section id="levels">
    <div class="home-top"><div class="brand" data-t="app.name"></div><div class="right"><button class="iconbtn langbtn" id="langBtn" aria-label="language"></button><button class="iconbtn" id="soundBtn" aria-label="sound"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button><div class="score"><b>★</b><span id="totalStars"></span></div></div></div>
    <p class="tagline" data-t="app.tagline"></p>
    <div id="endlessCard"></div>
    <div id="worlds"></div>
    <nav class="tabbar card" id="tabbar">
      <button data-tab="worlds"><svg class="ic" viewBox="0 0 24 24"><path d="M4 18c4-12 8-12 16 0" /></svg><span data-t="tab.worlds"></span></button>
      <button data-tab="reverse"><svg class="ic" viewBox="0 0 24 24"><path d="M4 18c4-12 8-12 16 0" stroke-dasharray="3 3"/><circle cx="12" cy="9" r="2"/></svg><span data-t="tab.reverse"></span></button>
      <button data-tab="endless"><svg class="ic" viewBox="0 0 24 24"><path d="M3 18l5-6 4 3 4-7 5 4"/><circle cx="8" cy="12" r="1.3"/><circle cx="16" cy="8" r="1.3"/></svg><span data-t="tab.endless"></span></button>
    </nav>
  </section>

  <section id="play" class="hidden">
    <div class="top">
      <button class="back" id="backBtn" aria-label="back"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="ttl"><div class="title" id="lvTitle"></div><div class="tries" id="tries"></div></div>
      <div class="side"><div class="best" id="bestStars"></div><button class="help" id="helpBtn" data-t-aria="lesson.help" aria-label="?">?</button></div>
    </div>
    <div class="boardWrap card" id="boardWrap">
      <canvas id="cv"></canvas>
      <div class="camBtns"><button id="midBtn" aria-label="midpoint"><svg class="ic" viewBox="0 0 24 24"><circle cx="4" cy="16" r="2"/><circle cx="20" cy="8" r="2"/><path d="M6 15l12-6" stroke-dasharray="2 3"/><path d="M12 9l3 3-3 3-3-3z"/></svg></button><button id="ghostBtn" aria-label="ghost graph"><svg class="ic" viewBox="0 0 24 24"><path d="M3 19c3-14 6-14 9-7s6 7 9-7" stroke-dasharray="3 3"/></svg></button><button id="zoomIn" aria-label="zoom in"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button id="zoomOut" aria-label="zoom out"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><button id="zoomReset" aria-label="reset view"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6"/></svg></button></div>
      <div class="toast" id="toast" style="opacity:0"></div>
    </div>
    <div class="goals" id="goals"></div>
    <div class="hint" id="hint"></div>
    <div class="expr card"><div class="txt" id="exprTxt"></div><div class="cost" id="exprCost"></div></div>
    <div class="pad fns" id="fnPad"></div>
    <div class="pad" id="pad"></div>
  </section>
</div>

<div class="modal hidden" id="lessonModal">
  <div class="sheet card lesson">
    <div class="ltag" id="lessonTag"></div>
    <h2 id="lessonTitle"></h2>
    <div class="lgraph" id="lessonGraph"></div>
    <div class="legend" id="lessonLegend"></div>
    <p class="lbody" id="lessonBody"></p>
    <div class="row"><button class="main" id="lessonBtn"></button></div>
  </div>
</div>

<div class="modal hidden" id="karneModal">
  <div class="sheet card karne">
    <h2 data-t="karne.title"></h2>
    <p class="kstat" id="karneStat"></p>
    <p id="karneBest"></p>
    <canvas id="karneCv" width="720" height="440"></canvas>
    <ol id="karneList"></ol>
    <div class="row">
      <button id="karneHome" data-t="karne.home"></button>
      <button id="karneAgain" class="main" data-t="karne.again"></button>
    </div>
  </div>
</div>

<div class="modal hidden" id="winModal">
  <div class="sheet card">
    <h2 data-t="win.title"></h2>
    <div class="stars" id="winStars"><span>★</span><span>★</span><span>★</span></div>
    <p id="winCost"></p>
    <p id="winNeed"></p>
    <div class="row">
      <button id="againBtn" data-t="win.again"></button>
      <button id="nextBtn" class="main" data-t="win.next"></button>
    </div>
  </div>
</div>

<script>
// Tarayıcı eski dosyaları önbellekten kullanmasın (ham 'lv.2-10' anahtarları görünüyordu): adreslere sürüm ekle.
{ const v = Date.now(); for (const f of ['locales/tr.js', 'locales/en.js', 'engine.js', 'levels.js', 'lessons.js', 'endless.js']) document.write(`<script src="${f}?v=${v}"><\/script>`); }
</script>
<script>
'use strict';
/* ===================== DİL ===================== */
const LOCALES = window.LOCALES || {};
const FALLBACK_LANG = 'en';
const DEV = Object.fromEntries(new URLSearchParams(location.search));
function detectLang() {
  if (DEV.lang && LOCALES[DEV.lang]) return DEV.lang;
  // Oyuncunun seçtiği dil (ana ekrandaki TR/EN düğmesi) tarayıcı dilinden önce gelir
  try { const saved = JSON.parse(localStorage.getItem('hv-lang')); if (LOCALES[saved]) return saved; } catch (e) {}
  for (const l of navigator.languages || [navigator.language || 'en']) {
    const base = String(l).toLowerCase().split('-')[0];
    if (LOCALES[base]) return base;
  }
  return FALLBACK_LANG;
}
const lang = detectLang();
document.documentElement.lang = lang;
function t(key, p = {}) {
  let s = LOCALES[lang]?.strings[key] ?? LOCALES[FALLBACK_LANG]?.strings[key] ?? key;
  return s.replace(/\{(\w+)\}/g, (_, k) => (k in p ? p[k] : `{${k}}`));
}
function applyStatic() {
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-t-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.tAria)));
}

const S = {

  cursor: 0,     // imleç: pieces içindeki konum (0 = en baş)

// Ek tuşlar (bölümün `keys` listesinde açılır). ins: ifadeye eklenen metin.
const FN_KEYS = {
  abs: { label: '| |', ins: '|' },   // aç/kapa: açık mutlak değer yoksa açar, varsa kapatır
  sq:  { label: '<span class="var">x</span>²', ins: '^2' },
  pow: { label: '^', ins: '^' },
  sqrt:{ label: '√', ins: 'sqrt(' },
  sin: { label: 'sin', ins: 'sin(' },
  cos: { label: 'cos', ins: 'cos(' },
  pi:  { label: 'π', ins: 'π' },
};
// Ekranda parça nasıl görünür
const pretty = s => s.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−').replace(/sqrt\(/g, '√(').replace(/\^2/g, '²');
// Değişken x, çarpma × ile karışmasın: eğik matematik harfi (HTML döndürür)
const VAR_X = '<span class="var">x</span>';
const prettyHtml = s => pretty(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/(?<!e)x/g, VAR_X);

/* ===================== DERSLER =====================
   Bölüm başlamadan açılan pencere (bölüm bitmediyse) ve başlıktaki ? düğmesi.
   Her dersin küçük grafiği: ilk eğri kesikli "ana" eğri, sonrakiler renkli dönüşmüş hâlleri.
   Metinler locales 'lesson.<ad>.title/body'; metindeki `formül`ler matematik yazısına çevrilir. */
const LESSONS = window.LESSON_DATA.LESSONS;   // www/lessons.js
const LESSON_COLORS = ['var(--path)', 'var(--p1d)', 'var(--p4d)', 'var(--p5d)'];
// Formülü ekranda göster: abs(…) → |…|, ^2 → ², eğik x
const mathHtml = src => prettyHtml(String(src).replace(/abs\(([^()]*)\)/g, '|$1|')).replace(/÷/g, '/');

function lessonSvg(L) {
  const W = 320, H = 190, [x0, x1, y0, y1] = L.view;
  const k = Math.min(W / (x1 - x0), H / (y1 - y0));
  const ox = (W - (x1 - x0) * k) / 2, oy = (H - (y1 - y0) * k) / 2;
  const px = x => (ox + (x - x0) * k).toFixed(1), py = y => (oy + (y1 - y) * k).toFixed(1);
  let g = '';
  for (let x = Math.ceil(x0); x <= x1; x++) g += `M${px(x)} ${py(y0)}V${py(y1)}`;
  for (let y = Math.ceil(y0); y <= y1; y++) g += `M${px(x0)} ${py(y)}H${px(x1)}`;
  let out = `<svg viewBox="0 0 ${W} ${H}"><path d="${g}" stroke="var(--ink)" stroke-opacity=".08" stroke-width="1"/>
    <path d="M${px(x0)} ${py(0)}H${px(x1)}M${px(0)} ${py(y0)}V${py(y1)}" stroke="var(--axis)" stroke-width="1.5"/>`;
  const multi = L.curves.length > 1;
  L.curves.forEach((src, i) => {
    const f = Engine.parse(src).fn;
    let d = '', pen = false;
    for (let x = x0; x <= x1 + 1e-9; x += (x1 - x0) / 320) {
      const y = f(x);
      if (!Number.isFinite(y) || y > y1 + 2 || y < y0 - 2) { pen = false; continue; }
      d += `${pen ? 'L' : 'M'}${px(x)} ${py(y)}`; pen = true;
    }
    const base = multi && i === 0;
    const color = base ? 'var(--ink)' : LESSON_COLORS[(multi ? i - 1 : 0) % LESSON_COLORS.length];
    out += `<path d="${d}" fill="none" stroke="${color}" stroke-width="${base ? 2 : 3}" ${base ? 'stroke-dasharray="5 5" stroke-opacity=".55"' : ''} stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  const last = Engine.parse(L.curves[L.curves.length - 1]).fn;
  for (const mx of L.marks || []) {
    const my = last(mx);
    out += `<circle cx="${px(mx)}" cy="${py(my)}" r="4" fill="var(--ink)"/>
      <text x="${px(mx)}" y="${+py(my) - 9}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="700" fill="var(--ink)">(${fmtCoord(mx)}, ${fmtCoord(my)})</text>`;
  }
  return out + '</svg>';
}

function showLesson(L, auto) {
  const key = L.lesson, D = LESSONS[key];
  if (!D) return;
  $('lessonTag').textContent = `${t('world.' + L.world)} · ${t('play.level', { n: L.id })}`;
  $('lessonTitle').textContent = t(`lesson.${key}.title`);
  $('lessonGraph').innerHTML = lessonSvg(D);
  const multi = D.curves.length > 1;
  $('lessonLegend').innerHTML = D.curves.map((c, i) => {
    const base = multi && i === 0;
    const color = base ? 'var(--ink)' : LESSON_COLORS[(multi ? i - 1 : 0) % LESSON_COLORS.length];
    return `<span><i class="${base ? 'base' : ''}" style="border-color:${color}"></i><span class="f">${mathHtml(c)}</span></span>`;
  }).join('');
  $('lessonBody').innerHTML = t(`lesson.${key}.body`).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/`([^`]+)`/g, (_, f) => `<span class="f">${mathHtml(f)}</span>`);
  $('lessonBtn').textContent = t(auto ? 'lesson.start' : 'lesson.close');
  $('lessonModal').classList.remove('hidden');
}
const lessonOpen = () => !$('lessonModal').classList.contains('hidden');
$('lessonBtn').onclick = () => $('lessonModal').classList.add('hidden');
$('lessonModal').addEventListener('click', e => { if (e.target.id === 'lessonModal') $('lessonModal').classList.add('hidden'); });

/* ===================== İPUCU =====================
   Ekranda konu adı bile yazmaz; oyuncu ne yapacağını haritadan anlamalı, bilmiyorsa ? ile dersi açar.
   İpucu (konu adı + yönlendirme) varsayılan GİZLİ, oyuncu isterse açılır (sahip, 2026-11-16). İpuçları cevabı
   değil neye bakılacağını söyler. 3 başarısız denemeden sonra düğme 3 kez atar ve sarı kalır.
   İleride ödüllü reklama bağlanacak: HINT_RULES.needAd = true ve requestHint içinde reklam. */
const HINT_RULES = { enabled: true, needAd: false, pulseAfterFails: 3 };
function requestHint(done) {
  if (!HINT_RULES.needAd) return done();
  // TODO(reklam): ödüllü reklam izlenince done() — stüdyo kitindeki NativeAds ile
  done();
}
// Konu adı da ipucunun parçası (sahip, 2026-11-16): ekranda hiçbir şey yazmaz, oyuncu ne yapacağını kendisi anlamalı.
/* ===================== ARAÇLAR =====================
   Haritaya dokununca koordinat; orta nokta düğmesiyle iki noktanın ortası (serbest).
   (Sayı ayarla aracı denendi, sahip beğenmedi ve kaldırıldı, 2026-11-16.) */

function renderHint() {
  const L = S.level;
  const topic = `<b>${t('topic.' + L.topic)}.</b>`;
  if (!HINT_RULES.enabled) { $('hint').innerHTML = ''; return; }
  if (S.hintShown) { $('hint').innerHTML = `<span class="hintText">${topic} ${t('lv.' + L.id)}</span>`; return; }
  const pulse = S.fails >= HINT_RULES.pulseAfterFails ? ' pulse' : '';
  $('hint').innerHTML = `<button class="hintBtn${pulse}" id="hintBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>${t('hint.show')}</button>`;
  $('hintBtn').onclick = () => requestHint(() => {
    S.hintShown = true;
    progress.hints = progress.hints || {}; progress.hints[L.id] = true; saveProgress();  // ileride yıldız kuralı için
    Fx.key(); renderHint();
  });
}

// Her dünyanın kartında kendi eğrisinin minik ikonu (ızgara + eğri)

  </div>`;
  $('endlessBtn').onclick = () => startEndless();

// Ana ekran sekmeleri (sahip, 2026-11-16): Bölümler (1–4. dünyalar) · Ters bulmaca (5) · Sonsuz
const REVERSE_WORLD = 5;
S.tab = store.get('hv-tab', 'worlds');
$('tabbar').addEventListener('click', e => {

  Fx.key(); Hap.tick();

function renderLevels() {
  [...$('tabbar').children].forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  $('endlessCard').classList.toggle('hidden', S.tab !== 'endless');

$('worlds').addEventListener('click', e => {

function showScreen(name) {
  $('levels').classList.toggle('hidden', name !== 'levels');

/* ===================== OYUN EKRANI ===================== */
function openLevel(L) {
  S.level = L; S.pieces = []; S.cursor = 0; S.ghosts = []; S.anim = null; S.last = null; S.tries = 0; S.camAuto = true;
  $('lvTitle').textContent = L.endless ? t('endless.title') : t('world.' + L.world);
  $('helpBtn').classList.toggle('hidden', !!L.endless);   // sonsuz modda ders yok
  readColors();
  S.hintShown = false; S.fails = 0; S.picks = [];
  if (L.endless) $('hint').innerHTML = ''; else renderHint();
  buildPad();
  updateExpr();
  showScreen('play');
  resetCamera();
  // Ders: yalnız yeni bir konu ilk kez geldiğinde kendiliğinden açılır (her ders bir kez); sonra yalnız ? ile.
  progress.seen = progress.seen || {};
  if (L.lesson && !progress.seen[L.lesson] && DEV.nolesson == null) {
    showLesson(L, true);
    progress.seen[L.lesson] = true;
    saveProgress();
  } else $('lessonModal').classList.add('hidden');
}

function buildPad() {
  const ban = S.level.ban || [];
  const keys = (DEV.dev != null ? Object.keys(FN_KEYS) : (S.level.keys || [])).filter(k => !ban.includes(k));
  $('fnPad').innerHTML = keys.map(k => `<button class="k fn" data-ins="${FN_KEYS[k].ins}">${FN_KEYS[k].label}</button>`).join('') +
    `<button class="k fn nav" data-ins="←" aria-label="left"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button class="k fn nav" data-ins="→" aria-label="right"><svg class="ic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>`;
  $('fnPad').style.gridTemplateColumns = `repeat(${Math.max(keys.length + 2, 5)}, 1fr)`;
  const rows = [
    ['7', '8', '9', ['/', '÷', 'op'], ['⌫', '<svg class="ic" viewBox="0 0 24 24"><path d="M9 6h11v12H9l-6-6z M12 9.5l5 5M17 9.5l-5 5"/></svg>', 'op del']],
    ['4', '5', '6', ['*', '×', 'op'], ['(', '(', 'op']],
    ['1', '2', '3', ['-', '−', 'op'], [')', ')', 'op']],
    ['0', '.', ['x', VAR_X, ''], ['+', '+', 'op'], ['go', t('play.launch'), 'go']],
  ];
  $('pad').innerHTML = rows.flat().map(k => {
    const [ins, label, cls] = Array.isArray(k) ? k : [k, k, ''];
    return `<button class="k ${cls}" data-ins="${ins}">${label}</button>`;
  }).join('');
}

// Açık (kapanmamış) mutlak değer var mı? İmlecin solundaki parçalarda abs( ile ) eşleştirilir.
function openAbsBefore(i) {
  const st = [];
  for (let k = 0; k < i; k++) {
    const p = S.pieces[k];
    if (p === 'abs(' || /\($/.test(p)) st.push(p === 'abs(' ? 'abs' : 'par');
    else if (p === ')') st.pop();
  }
  return st.length && st[st.length - 1] === 'abs';
}
function press(ins) {
  if (ins === '|') ins = openAbsBefore(S.cursor) ? ')' : 'abs(';
  if (S.anim) return;
  if (!['go', '←', '→', 'home', 'end'].includes(ins)) S.last = null; // yazmaya başlayınca son yol silinir (soluk iz olarak kalır)
  if (ins === 'go') return launch();
  Fx.key(); Hap.tick();
  if (ins === '←') S.cursor = Math.max(0, S.cursor - 1);
  else if (ins === '→') S.cursor = Math.min(S.pieces.length, S.cursor + 1);
  else if (ins === 'home') S.cursor = 0;
  else if (ins === 'end') S.cursor = S.pieces.length;
  else if (ins === '⌫') { if (S.cursor > 0) S.pieces.splice(--S.cursor, 1); }
  else if (ins === 'del') S.pieces.splice(S.cursor, 1);
  else if (S.pieces.length < 40) S.pieces.splice(S.cursor++, 0, ins);
  updateExpr();
}
for (const pad of [$('pad'), $('fnPad')]) {
  pad.addEventListener('pointerdown', e => {
    const b = e.target.closest('.k');
    if (!b) return;
    e.preventDefault();
    press(b.dataset.ins);
  });
}
// Bilgisayarda klavyeyle de yazılabilsin (geliştirme kolaylığı)
document.addEventListener('keydown', e => {
  if (lessonOpen()) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); $('lessonModal').classList.add('hidden'); } return; }
  if ($('play').classList.contains('hidden') || !$('winModal').classList.contains('hidden')) {
    if (e.key === 'Enter' && !$('winModal').classList.contains('hidden')) $('nextBtn').click();
    return;
  }
  if (e.metaKey || e.ctrlKey) return;
  if (e.key === 'Enter') return press('go');
  if (e.key === 'Backspace') return press('⌫');
  if (e.key === 'Delete') return press('del');
  if (e.key === 'ArrowLeft') return press('←');
  if (e.key === 'ArrowRight') return press('→');
  if (e.key === 'Home') return press('home');
  if (e.key === 'End') return press('end');
  if (e.key === 'Escape') return showScreen('levels');
  if (e.key === '|') return press('|');
  if (/^[0-9a-z.,+\-*/^()]$/i.test(e.key)) press(e.key.toLowerCase());
});

function updateExpr() {
  const src = S.pieces.join('');
  S.parsed = src ? Engine.parse(src) : null;
  const txt = $('exprTxt'), cost = $('exprCost');
  const caret = '<span class="caret"></span>';
  if (!src) txt.innerHTML = caret + `<span class="ph">${t('play.placeholder')}</span>`;
  // Mutlak değer |…| olarak görünür: abs( yerine "|", onu kapatan ) yerine "|"
  const shown = [], st = [];
  for (const p of S.pieces) {
    if (p === 'abs(') { st.push('abs'); shown.push('|'); }
    else if (/\($/.test(p)) { st.push('par'); shown.push(prettyHtml(p)); }
    else if (p === ')') { shown.push(st.pop() === 'abs' ? '|' : ')'); }
    else shown.push(prettyHtml(p));
  }
  if (src) txt.innerHTML = S.pieces.map((p, i) => (i === S.cursor ? caret : '') + `<span class="pc" data-i="${i}">${shown[i]}</span>`).join('') +
    (S.cursor === S.pieces.length ? caret : '');
  // İmleç görünür kalsın
  const c = txt.querySelector('.caret');
  if (c && c.offsetLeft < txt.scrollLeft + 10) txt.scrollLeft = c.offsetLeft - 30;
  else if (c && c.offsetLeft > txt.scrollLeft + txt.clientWidth - 10) txt.scrollLeft = c.offsetLeft - txt.clientWidth + 30;
  if (!src) { cost.textContent = ''; cost.className = 'cost'; }
  else if (S.parsed.ok) { cost.textContent = ''; cost.className = 'cost'; }
  else { cost.textContent = t('err.' + S.parsed.error); cost.className = 'cost err'; }
  $('pad').querySelector('.go').disabled = !(S.parsed && S.parsed.ok);
  $('tries').textContent = S.level.endless
    ? `${t('endless.status', { n: EN.stage + 1 })} · ${'♥'.repeat(EN.lives)}${'♡'.repeat(3 - EN.lives)}`
    : t('play.level', { n: S.level.id }) + (S.tries ? ' · ' + t('play.tries', { n: S.tries }) : '');
  renderGoals();
  draw();
}

// İfadeye dokununca imleç oraya gider (parçanın sağ yarısına dokunursan arkasına)
// İfadeye dokununca imleç oraya gider (parçanın sağ yarısına dokunursan arkasına)
$('exprTxt').addEventListener('pointerdown', e => {
  if (S.anim) return;
  const pc = e.target.closest('.pc');
  if (pc) {
    const r = pc.getBoundingClientRect();
    S.cursor = +pc.dataset.i + (e.clientX > r.left + r.width / 2 ? 1 : 0);

/* ===================== SES VE TİTREŞİM =====================
   Ses dosyası yok: WebAudio ile üretilir (−2048'deki Fx'ten uyarlandı). Ses bağlamı açılışta (askıda) kurulur,
   ilk dokunuşta yalnız resume() (ilk dokunuşta kurmak takılma yapıyordu, LITTLE_LEMMA §8).
   Titreşim: Capacitor Haptics (telefonda), tarayıcıda navigator.vibrate varsa o. */
const Fx = {
  ctx: null,
  get on() { return store.get('hv-sound', true); },
  set on(v) { store.set('hv-sound', v); },
  create() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } },
  unlock() { this.create(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(freq, dur = 0.1, { type = 'sine', vol = 0.06, delay = 0, to = 0 } = {}) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur = 0.15, { vol = 0.12, freq = 500, delay = 0 } = {}) {

    const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    src.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(this.ctx.destination);
    src.start(this.ctx.currentTime + delay);
  },
  key() { this.tone(620, 0.035, { type: 'triangle', vol: 0.025 }); },
  launch() { this.tone(260, 0.22, { type: 'triangle', vol: 0.05, to: 620 }); },
  gem(i) { const f = 784 * Math.pow(2, (i * 2) / 12); this.tone(f, 0.16, { vol: 0.07 }); this.tone(f * 2, 0.1, { type: 'triangle', vol: 0.025, delay: 0.03 }); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.2, { type: 'triangle', vol: 0.07, delay: i * 0.085 })); },
  star(i) { this.tone(880 * Math.pow(1.26, i), 0.18, { vol: 0.06 }); },
  crash() { this.noise(0.2, { vol: 0.22, freq: 380 }); this.tone(150, 0.22, { vol: 0.09, to: 60 }); },

const KEY_NAME = { sq: 'x²', pow: '^', abs: '|x|', sin: 'sin', cos: 'cos', sqrt: '√', pi: 'π' };
function launch() {
  if (!S.parsed || !S.parsed.ok || S.anim) return;
  const rule = Engine.checkRules(S.level, S.parsed);
  if (rule) { toast(t('rule.' + rule.code, { k: KEY_NAME[rule.key] || rule.key })); Fx.fail(); Hap.warn(); return; }
  if (S.level.endless && !(Math.abs(S.parsed.fn(0)) < 1e-6)) { toast(t('endless.start')); Fx.fail(); Hap.warn(); return; }
  const sim = Engine.simulate(S.level, S.parsed.fn);
  // Yol boyunca birikimli uzunluk: karakter sabit hızla ilerlesin
  const cum = [0];
  for (let i = 1; i < sim.path.length; i++) {
    const [ax, ay] = sim.path[i - 1], [bx, by] = sim.path[i];
    cum.push(cum[i - 1] + Math.hypot(bx - ax, by - ay));
  }
  const total = cum[cum.length - 1];
  const dur = Math.max(900, Math.min(3200, total / 9 * 1000));
  S.tries++;
  S.last = null;
  S.anim = { sim, cum, total, dur, t0: performance.now(), idx: 0, gotNow: 0, cost: S.parsed.cost };
  S.lastCost = S.parsed.cost;
  $('pad').classList.add('busy'); $('fnPad').classList.add('busy');
  Fx.launch(); Hap.hit();
  kick();
}

// Uçuşun bir karesi (döngü frame() içinden çağrılır). Hafif hızlanarak başlar.
function stepAnim(now) {
  const A = S.anim;
  const k = Math.min(1, (now - A.t0) / A.dur);
  const e = k * k * (3 - 2 * k) * 0.35 + k * 0.65;
  const d = A.total * e;
  while (A.idx < A.cum.length - 1 && A.cum[A.idx + 1] <= d) A.idx++;
  const gotNow = A.sim.gems.filter(g => g.at <= A.idx).length;
  if (gotNow !== A.gotNow) {
    for (let i = A.gotNow; i < gotNow; i++) {
      const [gx, gy] = S.level.gems[A.sim.gems[i].index];
      burst(gx, gy, [C.gem, C.label, C.star], 12, 5, 4);
      ring(gx, gy, C.gem, 1.4);
      Fx.gem(i); Hap.tick();
    }
    A.gotNow = gotNow;
    renderGoals();
    const chip = $('goals').children[1];
    if (chip) { chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump'); chip.addEventListener('animationend', () => chip.classList.remove('bump'), { once: true }); }
  }
  if (k >= 1) finish(A);
}

function finish(A) {
  S.anim = null;
  S.last = A.sim;
  S.ghosts.push(A.sim.path);
  if (S.ghosts.length > 4) S.ghosts.shift();
  $('pad').classList.remove('busy'); $('fnPad').classList.remove('busy');
  const L = S.level;
  const stars = Engine.stars(L, A.sim);
  renderGoals();
  draw();
  const [ex, eyRaw] = A.sim.path[A.sim.path.length - 1];
  const B = Engine.boardOf(L), ey = Math.max(B.ymin - 0.5, Math.min(B.ymax + 0.5, eyRaw));
  if (A.sim.result !== 'win') {
    if (A.sim.result === 'wall') {
      shakeBoard(); burst(ex, ey, [C.wall, C['wall-ink'], C.char], 14, 6, 4);
      S.hurtUntil = performance.now() + 450;
      Fx.crash(); Hap.error();
    } else {
      burst(ex, ey, [C.ghost, C.tick], 12, 3, 5);   // "puf"
      Fx.fail(); Hap.warn();
    }
    kick();
    S.fails = (S.fails || 0) + 1;
    if (S.fails === HINT_RULES.pulseAfterFails && !S.hintShown) renderHint();
    toast(t('res.' + A.sim.result));
    if (L.endless) { EN.lives--; if (EN.lives <= 0) setTimeout(showKarne, 800); }
    updateExpr(); return;
  }
  // Kazanma: hedefte renkli patlama ve halka
  const tx = L.target ? L.target.x : ex, ty = L.target ? L.target.y : ey;
  burst(tx, ty, [C.target, C.gem, C.star, C.wall, C.path], 28, 9, 5);
  ring(tx, ty, C.target, 2.6); ring(tx, ty, C.star, 1.6);
  Fx.win(); Hap.success(); kick();
  if (L.endless) {   // sonsuz: yolu karneye ekle, hedef yeni orijin, sıradaki parça
    EN.segs.push({ src: S.pieces.join(''), path: A.sim.path.map(([x, y]) => [x + EN.origin[0], y + EN.origin[1]]) });
    EN.origin = [EN.origin[0] + L.target.x, EN.origin[1] + L.target.y];
    EN.stage++;
    setTimeout(loadChunk, 750);
    return;
  }
  if (stars > (progress.stars[L.id] || 0)) progress.stars[L.id] = stars;
  if (!progress.best[L.id] || A.cost < progress.best[L.id]) progress.best[L.id] = A.cost;
  saveProgress();
  renderGoals();
  setTimeout(() => showWin(stars, A.cost), 520);
}

// Harita matematik koordinatlarında; kamera haritanın bir bölümünü gösterir.
// cam.cx, cam.cy: ekranın ortasındaki nokta · cam.ppu: bir birimin piksel boyu
const cv = $('cv'), ctx = cv.getContext('2d');

const VIEW_UNITS = 30;        // ilk görünüm: kısa kenarda 30 birim
let C = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['board', 'grid', 'grid-strong', 'axis', 'tick', 'outside', 'wall', 'wall-ink', 'gem', 'gem-ink', 'target', 'target-ink', 'char', 'path', 'ghost', 'danger', 'bg', 'label', 'label-ink', 'star'])
    C[k] = cs.getPropertyValue('--' + k).trim();

const X = x => cam.w / 2 + (x - cam.cx) * cam.ppu;
const Y = y => cam.h / 2 - (y - cam.cy) * cam.ppu;
const toWorld = (px, py) => [cam.cx + (px - cam.w / 2) / cam.ppu, cam.cy - (py - cam.h / 2) / cam.ppu];

function resize() {
  const r = $('boardWrap').getBoundingClientRect();
  if (!r.width || !r.height) return;
  const first = !cam.w;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cam.w = r.width; cam.h = r.height;
  if (first || S.camAuto) resetCamera(); else draw();
}
new ResizeObserver(resize).observe($('boardWrap'));

// İlk görünüm: kısa kenarda 30 birim, sol kenar x = −3; içerik sığmıyorsa uzaklaş.
function resetCamera() {
  if (!S.level || !cam.w) return;
  const L = S.level, sx = L.startX || 0;
  const pts = [[0, 0], [sx, 0], ...(L.target ? [[L.target.x, L.target.y]] : []), ...(L.gems || []), ...(L.marks || [])];
  if (L.shape) pts.push([L.shape.from, L.shape.fn(L.shape.from)], [L.shape.to, L.shape.fn(L.shape.to)]);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  // İçerik küçükse yakın aç (en az 10 birim), büyükse en çok 30 birimlik görünüm; sığmıyorsa uzaklaş
  const span = Math.max(maxx - minx, maxy - miny) + 6;
  let ppu = Math.min(cam.w, cam.h) / Math.max(10, Math.min(VIEW_UNITS, span));
  ppu = Math.min(ppu, cam.w / (maxx - minx + 5), cam.h / (maxy - miny + 5));
  cam.ppu = ppu;
  const halfW = cam.w / 2 / ppu;
  cam.cx = Math.max(minx - 2 + halfW, (minx + maxx) / 2);
  cam.cy = (miny + maxy) / 2;
  S.camAuto = true;
  draw();
}
function zoomAt(px, py, k) {
  const minPpu = Math.min(cam.w, cam.h) / 90, maxPpu = Math.min(cam.w, cam.h) / 5;
  const [wx, wy] = toWorld(px, py);
  cam.ppu = Math.max(minPpu, Math.min(maxPpu, cam.ppu * k));
  cam.cx = wx - (px - cam.w / 2) / cam.ppu;
  cam.cy = wy + (py - cam.h / 2) / cam.ppu;
  S.camAuto = false;
  draw();
}

// Dokunma: bir parmak kaydırır, iki parmak yakınlaştırır; çift dokunuş sıfırlar. Bilgisayarda tekerlek.
const pointers = new Map();

cv.addEventListener('pointerdown', e => {
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  pointers.set(e.pointerId, [e.offsetX, e.offsetY]);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), ppu: cam.ppu };
    tap = null;
  } else if (pointers.size === 1) tap = { x: e.offsetX, y: e.offsetY, t: performance.now() };
});
// Dokunma (kaydırmadan kısa basış): en yakın elmas/hedef/işaret ya da ızgara noktası seçilir.
// İki nokta seçiliyse aralarına çizgi ve ortası çizilir (simetri bulmacaları için, kâğıt kalem yerine).
// Orta nokta düğmesi: açıkken iki noktaya dokununca ortaları çizilir; kapalıyken tek nokta (koordinatı).
S.midOn = false;
$('midBtn').onclick = () => { S.midOn = !S.midOn; $('midBtn').classList.toggle('on', S.midOn); if (!S.midOn) S.picks = S.picks.slice(-1); if (S.midOn) toast(t('tool.midHow')); Fx.key(); draw(); };
function handleTap(px, py) {
  const L = S.level;
  const cands = [[0, 0], [L.startX || 0, 0], ...(L.target ? [[L.target.x, L.target.y]] : []), ...(L.gems || []), ...(L.marks || [])];
  let best = null, bd = 16;
  for (const [x, y] of cands) { const d = Math.hypot(X(x) - px, Y(y) - py); if (d < bd) { bd = d; best = [x, y]; } }
  if (!best) { const [wx, wy] = toWorld(px, py); best = [Math.round(wx), Math.round(wy)]; }
  const same = S.picks.findIndex(p => p[0] === best[0] && p[1] === best[1]);
  if (same >= 0) S.picks.splice(same, 1);                        // aynı noktaya tekrar dokun: kaldır
  else if (!S.midOn) S.picks = [best];                           // normalde tek nokta
  else if (S.picks.length >= 2) S.picks = [best];                // orta nokta: üçüncü dokunuş baştan başlar
  else S.picks.push(best);
  Fx.key(); Hap.tick();
  draw();
}
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId), cur = [e.offsetX, e.offsetY];
  pointers.set(e.pointerId, cur);

  if (pointers.size === 1) {
    cam.cx -= (cur[0] - prev[0]) / cam.ppu;
    cam.cy += (cur[1] - prev[1]) / cam.ppu;
    S.camAuto = false;
    draw();
  } else if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    zoomAt(mx, my, (pinch.ppu * d / pinch.d) / cam.ppu);
  }
});
const endPointer = e => {
  if (tap && e.type === 'pointerup' && pointers.size === 1 && performance.now() - tap.t < 350 &&
      Math.hypot(e.offsetX - tap.x, e.offsetY - tap.y) < 7 && S.level && !S.anim) handleTap(e.offsetX, e.offsetY);

$('zoomOut').onclick = () => zoomAt(cam.w / 2, cam.h / 2, 1 / 1.4);

function roundRect(x, y, w, h, r) {

  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

const fmtNum = v => { const r = Math.round(v * 100) / 100; return (Object.is(r, -0) ? 0 : r).toString().replace('-', '−'); };
// Nokta etiketleri: π'nin katları "π/2", "3π/2" diye yazılır (π gerçek sayı olarak alınır, 2026-11-16)
function fmtCoord(v) {
  if (Math.abs(v - Math.round(v)) < 1e-9) return fmtNum(v);
  const r = v / Math.PI;
  for (const d of [1, 2, 3, 4, 6]) {

    }

}

function drawGrid(B) {
  const [x0w, y1w] = toWorld(0, 0), [x1w, y0w] = toWorld(cam.w, cam.h);
  // Harita dışı
  ctx.fillStyle = C.outside;
  if (X(B.xmin) > 0) ctx.fillRect(0, 0, X(B.xmin), cam.h);
  if (X(B.xmax) < cam.w) ctx.fillRect(X(B.xmax), 0, cam.w - X(B.xmax), cam.h);
  if (Y(B.ymax) > 0) ctx.fillRect(0, 0, cam.w, Y(B.ymax));
  if (Y(B.ymin) < cam.h) ctx.fillRect(0, Y(B.ymin), cam.w, cam.h - Y(B.ymin));
  // Izgara: birim çizgiler (yeterince büyükse) ve her 5'te belirgin çizgi
  const lines = (step, color) => {
    ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = Math.ceil(x0w / step) * step; x <= x1w; x += step) { ctx.moveTo(Math.round(X(x)) + 0.5, 0); ctx.lineTo(Math.round(X(x)) + 0.5, cam.h); }
    for (let y = Math.ceil(y0w / step) * step; y <= y1w; y += step) { ctx.moveTo(0, Math.round(Y(y)) + 0.5); ctx.lineTo(cam.w, Math.round(Y(y)) + 0.5); }
    ctx.stroke();
  };
  if (cam.ppu >= 6) lines(1, C.grid);
  lines(cam.ppu >= 6 ? 5 : 10, C['grid-strong']);
  // Eksenler
  ctx.strokeStyle = C.axis; ctx.lineWidth = 1.5; ctx.beginPath();
  ctx.moveTo(0, Y(0)); ctx.lineTo(cam.w, Y(0)); ctx.moveTo(X(0), 0); ctx.lineTo(X(0), cam.h); ctx.stroke();
  // Eksen sayıları (eksen ekran dışındaysa kenara yapışır)
  const step = [1, 2, 5, 10, 20, 50].find(s => s * cam.ppu >= 34) || 50;
  ctx.font = `600 10px ui-monospace, "SF Mono", Menlo, monospace`;
  ctx.fillStyle = C.tick;
  const ay = Math.max(2, Math.min(cam.h - 14, Y(0) + 3));
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let x = Math.ceil(x0w / step) * step; x <= x1w; x += step) if (x !== 0) ctx.fillText(fmtNum(x), X(x), ay);
  const ax = Math.max(14, Math.min(cam.w - 3, X(0) - 4));
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let y = Math.ceil(y0w / step) * step; y <= y1w; y += step) if (y !== 0) ctx.fillText(fmtNum(y), ax, Y(y));
}

// Karakter: yönü (ang, radyan, matematik yönünde) eğimi izler; gözler gittiği yere bakar. Çarpınca kısa süre kızarır.
function drawChar(x, y, alpha, ang = 0) {
  const r = Math.max(6, Engine.R * cam.ppu * 1.15);
  const hurt = S.hurtUntil && performance.now() < S.hurtUntil;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(X(x), Y(y)); ctx.rotate(-Math.max(-1.2, Math.min(1.2, ang)));
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = hurt ? C.danger : C.char; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = C['wall-ink']; ctx.stroke();
  ctx.fillStyle = C.board;
  ctx.beginPath(); ctx.arc(r * 0.25, -r * 0.15, r * 0.2, 0, Math.PI * 2); ctx.arc(r * 0.62, -r * 0.15, r * 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// Parçacıklar (dünya koordinatında; kamera ile birlikte kayar). dot: yerçekimiyle düşen nokta, ring: genişleyen halka.
const parts = [];
function burst(x, y, colors, n = 14, speed = 6, size = 4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = speed * (0.35 + Math.random() * 0.8);
    parts.push({ kind: 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v + speed * 0.3, life: 0, max: 0.45 + Math.random() * 0.45,
      color: colors[i % colors.length], size: size * (0.6 + Math.random() * 0.8) });
  }
}
function ring(x, y, color, r = 1.5) { parts.push({ kind: 'ring', x, y, life: 0, max: 0.45, color, r }); }
function drawParts() {
  for (const p of parts) {
    const k = p.life / p.max;
    ctx.save(); ctx.globalAlpha = Math.max(0, 1 - k);
    if (p.kind === 'ring') {
      ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), Math.max(4, p.r * cam.ppu * (0.3 + k)), 0, Math.PI * 2);
      ctx.strokeStyle = p.color; ctx.lineWidth = 3 * (1 - k) + 1; ctx.stroke();
    } else {
      ctx.translate(X(p.x), Y(p.y)); ctx.rotate(p.life * 6);
      ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.strokeStyle = C['wall-ink']; ctx.lineWidth = 1; ctx.strokeRect(-p.size / 2, -p.size / 2, p.size, p.size);
    }
    ctx.restore();
  }
}
function shakeBoard() { const b = $('boardWrap'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
// Sarsıntı bitince sınıfı kaldır: kalırsa ekran her yeniden açıldığında animasyon baştan oynuyordu (her bölüm açılışında titreme)
$('boardWrap').addEventListener('animationend', () => $('boardWrap').classList.remove('shake'));

// Tek çizim döngüsü: uçuş, parçacıklar ve kısa efektler sürerken çalışır, bitince durur (pil dostu).
let looping = false, lastT = 0;
function kick() { if (!looping) { looping = true; lastT = performance.now(); requestAnimationFrame(frame); } }
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  if (S.anim) stepAnim(now);
  for (const p of parts) {
    p.life += dt;
    if (p.kind === 'dot') { p.vy -= 14 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life >= parts[i].max) parts.splice(i, 1);
  draw();
  if (S.anim || parts.length || (S.hurtUntil && now < S.hurtUntil)) requestAnimationFrame(frame);
  else looping = false;
}

function draw() {
  if (!S.level || !cam.w) return;
  const L = S.level, B = Engine.boardOf(L), s = cam.ppu;
  ctx.clearRect(0, 0, cam.w, cam.h);
  ctx.fillStyle = C.board; ctx.fillRect(0, 0, cam.w, cam.h);
  drawGrid(B);

  // Engeller
  for (const w of L.walls || []) {
    roundRect(X(w.x), Y(w.y + w.h), w.w * s, w.h * s, Math.min(0.3 * s, w.w * s / 2, w.h * s / 2));
    ctx.fillStyle = C.wall; ctx.fill(); ctx.strokeStyle = C['wall-ink']; ctx.lineWidth = 2; ctx.stroke();
  }
  for (const r of L.rocks || []) {
    ctx.beginPath(); ctx.arc(X(r.x), Y(r.y), r.r * s, 0, Math.PI * 2);
    ctx.fillStyle = C.wall; ctx.fill(); ctx.strokeStyle = C['wall-ink']; ctx.lineWidth = 2; ctx.stroke();
  }

  // Hedef (ekranda en az birkaç piksel)
  const T = L.target, tr = Math.max(7, Engine.TARGET_R * s);
  if (T) {
    ctx.beginPath(); ctx.arc(X(T.x), Y(T.y), tr, 0, Math.PI * 2); ctx.fillStyle = C.target; ctx.fill();
    ctx.beginPath(); ctx.arc(X(T.x), Y(T.y), tr * 0.55, 0, Math.PI * 2); ctx.strokeStyle = C['target-ink']; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(X(T.x), Y(T.y), tr, 0, Math.PI * 2); ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(X(T.x), Y(T.y), tr * 0.18, 0, Math.PI * 2); ctx.fillStyle = C['target-ink']; ctx.fill();
  }
  // Ters bulmaca: izlenecek eğri kalın bir şerit (genişliği izin verilen sapma kadar)
  if (L.shape) {
    // Eğrinin görünen kısmının tamamı soluk; izlenmesi gereken aralık [from, to] koyu şerit
    const [xa] = toWorld(0, 0), [xb] = toWorld(cam.w, 0);
    const all = [], part = [];
    for (let x = xa; x <= xb; x += 1.5 / cam.ppu) {
      const y = L.shape.fn(x);
      if (Number.isFinite(y)) all.push([x, y]);
    }
    for (let x = L.shape.from; x <= L.shape.to + 1e-9; x += 0.04) part.push([x, L.shape.fn(x)]);
    const bw = Math.max(9, 2 * Engine.SHAPE_BAND * s + 4);
    ctx.save(); ctx.globalAlpha = 0.3; strokePath(all, all.length, C.wall, bw); ctx.restore();
    strokePath(all, all.length, C['wall-ink'], 1.2, [3, 6]);
    ctx.save(); ctx.globalAlpha = 0.8; strokePath(part, part.length, C.wall, bw); ctx.restore();
    strokePath(part, part.length, C['wall-ink'], 1.5, [3, 5]);
  }

  // Sonsuz: daha önce geçilen yollar (yeni orijine göre kaydırılmış)
  if (L.endless) for (const g of EN.segs) {
    const pts = g.path.map(([x, y]) => [x - EN.origin[0], y - EN.origin[1]]);
    ctx.save(); ctx.globalAlpha = 0.5; strokePath(pts, pts.length, C.path, 3); ctx.restore();
  }

  // Hayalet grafik: fonksiyonun görünen aralıktaki tamamı (kopuk yerlerde parça parça)
  if (S.ghostOn && S.parsed && S.parsed.ok && !S.anim) {
    const f = S.parsed.fn, [xa] = toWorld(0, 0), [xb] = toWorld(cam.w, 0), dx = 2 / cam.ppu;
    ctx.save(); ctx.strokeStyle = C.path; ctx.globalAlpha = 0.4; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
    ctx.beginPath();
    let pen = false, py = 0;
    for (let x = xa; x <= xb; x += dx) {
      const y = f(x), sy = Y(y);
      if (!Number.isFinite(y) || Math.abs(sy) > cam.h * 4 || (pen && Math.abs(sy - py) > cam.h)) { pen = false; continue; }
      if (pen) ctx.lineTo(X(x), sy); else ctx.moveTo(X(x), sy);
      pen = true; py = sy;
    }
    ctx.stroke(); ctx.restore();
  }

  // Önceki denemeler
  for (const g of S.ghosts) strokePath(g, g.length, C.ghost, 2);

  // Elmaslar (toplananlar soluk)
  const A = S.anim;
  const taken = new Set((A ? A.sim.gems.filter(g => g.at <= A.idx) : S.last ? S.last.gems : []).map(g => g.index));
  const gr = Math.max(6, Engine.GEM_R * s);
  (L.gems || []).forEach(([gx, gy], i) => {
    ctx.save(); ctx.translate(X(gx), Y(gy)); ctx.rotate(Math.PI / 4);
    roundRect(-gr * 0.75, -gr * 0.75, gr * 1.5, gr * 1.5, gr * 0.25);
    ctx.globalAlpha = taken.has(i) ? 0.25 : 1;
    ctx.fillStyle = C.gem; ctx.fill(); ctx.strokeStyle = C['gem-ink']; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  });

  // Yol: uçuşta çizilen kısım, bitince tamamı, yazarken önizleme (x = 0'dan itibaren 3 birim)
  const sx = L.startX || 0;
  let start = [sx, 0];
  if (S.parsed && S.parsed.ok) {
    const y = S.parsed.fn(sx);
    if (Number.isFinite(y) && y <= B.ymax && y >= B.ymin) start = [sx, y];
  }
  let cx = start[0], cy = start[1];
  if (A) {
    const p = A.sim.path;
    strokePath(p, A.idx + 1, C.path, 4);
    [cx, cy] = p[A.idx];
  } else if (S.last) {
    strokePath(S.last.path, S.last.path.length, C.path, 4);
  } else if (S.parsed && S.parsed.ok) {
    const f = S.parsed.fn, lim = L.preview ?? 3, pts = [];
    for (let x = sx; x <= sx + lim + 1e-9; x += 0.05) {
      const y = f(x);
      if (!Number.isFinite(y) || y > B.ymax + 1 || y < B.ymin - 1) break;
      pts.push([x, y]);
    }
    strokePath(pts, pts.length, C.path, 3, [2, 6]);
  }

  // Orijin işareti (karakter solda başlıyorsa da orijin yerinde kalır)
  ctx.beginPath(); ctx.arc(X(0), Y(0), 4, 0, Math.PI * 2); ctx.strokeStyle = C.axis; ctx.lineWidth = 2; ctx.stroke();

  // Koordinat etiketleri
  const label = (wx, wy, alpha, dy) => {
    const txt = `(${fmtCoord(wx)}, ${fmtCoord(wy)})`;
    const fs = 11;
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.font = `700 ${fs}px ui-monospace, "SF Mono", Menlo, monospace`;
    const w = ctx.measureText(txt).width + 8, h = fs + 5;
    let lx = X(wx) - w / 2, ly = Y(wy) - dy - h;
    if (ly < 2) ly = Y(wy) + dy;
    roundRect(lx, ly, w, h, 5); ctx.fillStyle = C.label; ctx.fill(); ctx.strokeStyle = C['wall-ink']; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = C['label-ink']; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    ctx.fillText(txt, lx + w / 2, ly + h / 2 + 0.5);
    ctx.restore();
  };
  if (!A) {
    (L.gems || []).forEach(([gx, gy], i) => label(gx, gy, taken.has(i) ? 0.35 : 1, gr + 3));
    if (T) label(T.x, T.y, 1, tr + 3);
    for (const [mx, my] of L.marks || []) {
      ctx.beginPath(); ctx.arc(X(mx), Y(my), 4.5, 0, Math.PI * 2); ctx.fillStyle = C['wall-ink']; ctx.fill();
      label(mx, my, 1, 8);
    }
  }

  // Dokunarak seçilen noktalar ve ortaları
  if (S.picks && S.picks.length) {
    const ink = C['wall-ink'];
    ctx.save(); ctx.strokeStyle = ink; ctx.lineWidth = 2;
    if (S.picks.length === 2 && S.midOn) {
      const [[ax, ay], [bx, by]] = S.picks, mx = (ax + bx) / 2, my = (ay + by) / 2;
      ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(X(mx), Y(my) - 7); ctx.lineTo(X(mx) + 7, Y(my)); ctx.lineTo(X(mx), Y(my) + 7); ctx.lineTo(X(mx) - 7, Y(my)); ctx.closePath();
      ctx.fillStyle = C.star; ctx.fill(); ctx.stroke();
      const txt = `${t('tool.mid')} (${fmtNum(mx)}, ${fmtNum(my)})`;
      ctx.font = `700 11px ui-monospace, "SF Mono", Menlo, monospace`;
      const w = ctx.measureText(txt).width + 10, h = 17, lx = X(mx) - w / 2, ly = Y(my) + 11;
      roundRect(lx, ly, w, h, 5); ctx.fillStyle = C.star; ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2b2622'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, X(mx), ly + h / 2 + 0.5);
    }
    for (const [x, y] of S.picks) {
      ctx.beginPath(); ctx.arc(X(x), Y(y), 9, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X(x) - 13, Y(y)); ctx.lineTo(X(x) - 5, Y(y)); ctx.moveTo(X(x) + 5, Y(y)); ctx.lineTo(X(x) + 13, Y(y));
      ctx.moveTo(X(x), Y(y) - 13); ctx.lineTo(X(x), Y(y) - 5); ctx.moveTo(X(x), Y(y) + 5); ctx.lineTo(X(x), Y(y) + 13); ctx.stroke();
    }
    ctx.restore();
    for (const [x, y] of S.picks) {
      const onItem = (L.gems || []).some(g => g[0] === x && g[1] === y) || (L.target && L.target.x === x && L.target.y === y) || (L.marks || []).some(g => g[0] === x && g[1] === y);
      if (!onItem) label(x, y, 1, 14);
    }
  }

  // Son denemenin bitişi: çarpma işareti
  if (!A && S.last && S.last.result !== 'win' && S.last.path.length) {
    const [ex, eyRaw] = S.last.path[S.last.path.length - 1];
    const ey = Math.max(B.ymin - 0.5, Math.min(B.ymax + 0.5, eyRaw));  // tahtanın çok dışında bittiyse kenarda göster
    const r = 7;
    ctx.save(); ctx.strokeStyle = C.danger; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(X(ex) - r, Y(ey) - r); ctx.lineTo(X(ex) + r, Y(ey) + r); ctx.moveTo(X(ex) + r, Y(ey) - r); ctx.lineTo(X(ex) - r, Y(ey) + r); ctx.stroke();
    ctx.restore();
  }

  // Karakter: yazarken yolun başladığı yerde (x = 0, y = f(0)) bekler
  if (A) {
    const p = A.sim.path, a = p[Math.max(0, A.idx - 2)], b = p[Math.min(p.length - 1, A.idx + 2)];
    drawChar(cx, Math.max(B.ymin - 0.5, Math.min(B.ymax + 0.5, cy)), 1, Math.atan2(b[1] - a[1], b[0] - a[0]));
  } else {
    // Yazarken yolun başlangıç yönüne bakar
    let ang = 0;
    if (S.parsed && S.parsed.ok && !S.last) { const d = (S.parsed.fn(sx + 0.01) - start[1]) / 0.01; if (Number.isFinite(d)) ang = Math.atan(d); }
    drawChar(start[0], start[1], S.last ? 0.5 : 1, ang);
  }
  drawParts();
}

/* ===================== SONSUZ MOD =====================
   Rider modeli (sahip, 2026-11-16): www/endless.js'deki aşamaların 3 çeşidinden biri gelir. Hedefe varınca orası
   yeni orijin olur, yeni duvarlar ve yeni hedef gelir. 3 yanlış hakkı; bitince "karne": bütün yol tek çizgi + formüller.
   Zaman sınırı ve elmas yok (sahip: ilk başta böyle, sonra değişebilir). Yol karakterden başlamalı (f(0) = 0). */
const EN = { on: false, stage: 0, origin: [0, 0], lives: 3, segs: [] };
function startEndless() {
  Object.assign(EN, { on: true, stage: 0, origin: [0, 0], lives: 3, segs: [] });
  $('karneModal').classList.add('hidden');
  loadChunk();
}
function loadChunk() {
  const c = window.ENDLESS.pick(EN.stage);
  S.chunk = c;   // geliştirme/test için
  openLevel({
    id: '∞', endless: true, world: 0, n: EN.stage + 1, start: [0, 0],
    target: { x: c.target[0], y: c.target[1] }, walls: c.walls, rocks: [], gems: [],
    keys: ['abs', 'sq', 'sin', 'pi'], wrong: [], lesson: null, topic: 'endless',
  });
}
function showKarne() {
  EN.on = false;
  const score = EN.segs.length;
  if (score > (progress.endlessBest || 0)) { progress.endlessBest = score; saveProgress(); }
  $('karneStat').textContent = t('karne.score', { n: score });
  $('karneBest').textContent = t('endless.best', { n: progress.endlessBest || 0 });
  $('karneList').innerHTML = EN.segs.map(g => `<li><span class="f">${mathHtml(g.src)}</span></li>`).join('');
  drawKarne();
  $('karneModal').classList.remove('hidden');
  Fx.win();
}
// Bütün yolu tek çizgi olarak çiz: her parça ayrı renkte, hedefler nokta
function drawKarne() {
  const kc = $('karneCv'), k = kc.getContext('2d'), W = kc.width, H = kc.height;
  const cs = getComputedStyle(document.documentElement), col = n => cs.getPropertyValue(n).trim();
  k.clearRect(0, 0, W, H);
  k.fillStyle = col('--board'); k.fillRect(0, 0, W, H);
  const pts = [[0, 0], ...EN.segs.flatMap(g => g.path)];
  if (!EN.segs.length) {
    k.fillStyle = col('--muted'); k.font = '600 26px ui-monospace, Menlo, monospace'; k.textAlign = 'center';
    k.fillText(t('karne.empty'), W / 2, H / 2); return;
  }
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs) - 1, x1 = Math.max(...xs) + 1, y0 = Math.min(...ys) - 1, y1 = Math.max(...ys) + 1;
  const sc = Math.min(W / (x1 - x0), H / (y1 - y0));
  const ox = (W - (x1 - x0) * sc) / 2, oy = (H - (y1 - y0) * sc) / 2;
  const KX = x => ox + (x - x0) * sc, KY = y => oy + (y1 - y) * sc;
  k.strokeStyle = col('--grid-strong'); k.lineWidth = 1; k.beginPath();
  for (let x = Math.ceil(x0); x <= x1; x += Math.max(1, Math.round(10 / sc))) { k.moveTo(KX(x), 0); k.lineTo(KX(x), H); }
  for (let y = Math.ceil(y0); y <= y1; y += Math.max(1, Math.round(10 / sc))) { k.moveTo(0, KY(y)); k.lineTo(W, KY(y)); }
  k.stroke();
  const colors = ['--path', '--p1d', '--p4d', '--p5d', '--p3d', '--p6d'].map(col);
  EN.segs.forEach((g, i) => {
    k.strokeStyle = colors[i % colors.length]; k.lineWidth = 6; k.lineCap = 'round'; k.lineJoin = 'round';
    k.beginPath(); g.path.forEach(([x, y], j) => (j ? k.lineTo(KX(x), KY(y)) : k.moveTo(KX(x), KY(y)))); k.stroke();
  });
  k.fillStyle = col('--ink');
  [[0, 0], ...EN.segs.map(g => g.path[g.path.length - 1])].forEach(([x, y]) => { k.beginPath(); k.arc(KX(x), KY(y), 7, 0, Math.PI * 2); k.fill(); });
}
$('karneAgain').onclick = () => startEndless();
$('karneHome').onclick = () => { $('karneModal').classList.add('hidden'); showScreen('levels'); };

{

// Geliştirme: ?level=2-5 doğrudan o bölümü açar, ?dev bütün bölüm ve tuşları açar
